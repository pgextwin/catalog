name: CLI latest Catalog real Windows GET-only canary
on:
  pull_request:
    paths:
      - 'dotnet/**'
      - '.github/workflows/cli-authenticated-latest-canary.yml'
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - '.github/workflows/cli-authenticated-latest-canary.yml'

permissions:
  contents: read

jobs:
  latest-real-70:
    name: Exact signed-Catalog main metadata and real 70 ZIP Windows E2E (nonpublishing)
    if: github.repository == 'pgextwin/catalog'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402'
      - name: Publish private self-contained win-x64 CLI (no Release)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'latest-cli'
          dotnet publish dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=10.0.13 -p:PublishTrimmed=true -p:TrimMode=full -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o $dir --nologo
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
          $exe=Join-Path $dir 'pgextwin.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'CLI EXE missing' }
          Write-Output "LATEST_CANARY_PRIVATE_EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant())"
      - name: Download all signed-Catalog live ZIPs via one command and rehash
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'latest-cli/pgextwin.exe'
          $parent=Join-Path $env:RUNNER_TEMP 'latest-download'
          New-Item -ItemType Directory -Path $parent | Out-Null
          Push-Location $parent
          try {
            $receipt=& $exe download-all --pg all --latest 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "Latest download must fail closed, not be waived: $receipt" }
            if ($receipt -notmatch 'CATALOG_AUTH=SIGSTORE_VERIFIED_FEED') { throw 'Authenticated latest receipt missing' }
            $folders=@(Get-ChildItem -LiteralPath $parent -Directory | Where-Object { $_.Name -cmatch '^pgextwin-pg[1-9][0-9]*-[1-9][0-9]*$' })
            if ($folders.Count -ne 1) { throw 'Expected exactly one signed PG cohort directory' }
            $folder=$folders[0].FullName
            $info=Get-Content -LiteralPath (Join-Path $folder 'DOWNLOAD-INFO.json') -Raw | ConvertFrom-Json
            $expected=[int]$info.zipCount
            if ($expected -lt 1 -or
                $receipt -notmatch "ZIP_COUNT=$expected\b" -or
                @($info.packages).Count -ne $expected -or
                $info.source -cne 'SIGSTORE_SIGNED_CATALOG_FEED_ORIGINAL_ZIPS' -or
                $info.signatureVerified -ne $false -or $info.provenanceVerified -ne $false -or
                $info.publicationAuthorized -ne $false -or $info.distributionAuthorized -ne $false -or
                $info.installAuthorized -ne $false -or $info.verificationLevel -cne 'INTEGRITY_ONLY') {
              throw 'Unsafe or incomplete live latest receipt'
            }
            $match=[regex]::Match($receipt, 'CATALOG_COMMIT=([0-9a-f]{40})')
            if (!$match.Success) { throw 'Missing signed feed source commit' }
            $source=$match.Groups[1].Value
            $cohort=Invoke-RestMethod -Uri "https://raw.githubusercontent.com/pgextwin/catalog/$source/config/cli-feed-majors.json"
            $approved=[string[]]@($cohort.postgresqlMajors)
            $actual=[string[]]@($info.packages | ForEach-Object { [string]$_.pgMajor } | Sort-Object -Unique)
            $extensions=[string[]]@($info.packages | ForEach-Object { [string]$_.extension } | Sort-Object -Unique)
            $pairs=@($info.packages | ForEach-Object { "$($_.extension)|$($_.pgMajor)" })
            if ($cohort.schemaVersion -ne 1 -or $approved.Count -lt 1 -or
                ($approved -join ',') -cne ($actual -join ',') -or
                $expected -ne ($approved.Count * $extensions.Count) -or
                @($pairs | Sort-Object -Unique).Count -ne $expected -or
                (Split-Path $folder -Leaf) -cne "pgextwin-pg$($approved[0])-$($approved[-1])") {
              throw 'Signed latest cohort and actual ZIP matrix differ'
            }
            $hashes=0
            foreach ($row in $info.packages) {
              if ($row.catalogCommit -notmatch '^[0-9a-f]{40}$' -or $row.releaseTag -notmatch '^[a-zA-Z0-9._-]+$') { throw 'Unpinned latest receipt' }
              $file=Join-Path $folder $row.relativePath
              if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Missing real ZIP' }
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $row.sha256) { throw 'Real ZIP bytes wrong' }
              $hashes++
            }
            if ($hashes -ne $expected) { throw 'Wrong original real ZIP count' }
            Write-Output "LATEST_CATALOG_REAL_ZIPS=PASS SHA256=$hashes/$expected CATALOG_AUTH=SIGSTORE_VERIFIED_FEED SIGNATURE_VERIFIED=false PUBLISH=DENY"
          }
          finally { Pop-Location }
