name: CLI anonymous latest no-token acceptance
on:
  pull_request:
    paths:
      - 'dotnet/**'
      - '.github/workflows/cli-anonymous-latest.yml'
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - '.github/workflows/cli-anonymous-latest.yml'
permissions:
  contents: read
jobs:
  anonymous-real-70:
    name: Anonymous default-command Windows 70 ZIP acceptance (no GH_TOKEN)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.402'
      - name: Build private latest-capable Windows EXE
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'anon-cli'
          dotnet publish dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=10.0.13 -p:PublishTrimmed=false -p:DebugType=none -p:DebugSymbols=false -o $dir --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Exact anonymous one-line latest PG14-18 70 ZIP full-batch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Anonymous environment not isolated' }
          $p=Join-Path $env:RUNNER_TEMP 'anonymous-latest'
          New-Item -ItemType Directory $p | Out-Null
          Push-Location $p
          try {
            $exe=Join-Path $env:RUNNER_TEMP 'anon-cli/pgextwin.exe'
            $log=& $exe download-all --pg all 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "ANONYMOUS_DEFAULT_LATEST=NO_GO; original error: $log" }
            if ($log -notmatch 'ZIP_COUNT=70') { throw 'ANONYMOUS_DEFAULT_LATEST=NO_GO; partial batch' }
            $folder=Join-Path $p 'pgextwin-pg14-18'
            $manifest=Get-Content -LiteralPath (Join-Path $folder 'DOWNLOAD-INFO.json') -Raw | ConvertFrom-Json
            if ($manifest.zipCount -ne 70 -or $manifest.signatureVerified -ne $false -or
                $manifest.installAuthorized -ne $false -or $manifest.verificationLevel -cne 'INTEGRITY_ONLY') {
              throw 'Untrusted output was incorrectly authorized'
            }
            $count=0
            foreach ($row in $manifest.packages) {
              $path=Join-Path $folder $row.relativePath
              if (!(Test-Path -LiteralPath $path)) { throw 'Anonymous ZIP absent' }
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $row.sha256) { throw 'Anonymous byte mismatch' }
              $count++
            }
            if ($count -ne 70) { throw 'Anonymous wrong count' }
            Write-Output 'ANONYMOUS_DEFAULT_LATEST=PASS SHA256=70/70 NO_TOKEN=true'
          } finally { Pop-Location }
