name: CLI anonymous latest no-token acceptance
on:
  pull_request:
    paths:
      - 'dotnet/**'
      - '.github/workflows/cli-anonymous-latest.yml'
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - '.github/workflows/cli-anonymous-latest.yml'
permissions:
  contents: read
jobs:
  # Retain legacy job ID/name so existing branch-protection contexts remain stable.
  anonymous-real-70:
    name: Anonymous default-command Windows 70 ZIP acceptance (no GH_TOKEN)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.402'
      - name: Build private latest-capable Windows EXE
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'anon-cli'
          dotnet publish dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=10.0.13 -p:PublishTrimmed=true -p:TrimMode=full -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o $dir --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Exact anonymous signed latest PG cohort full-batch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Anonymous environment not isolated' }
          $p=Join-Path $env:RUNNER_TEMP 'anonymous-latest'
          New-Item -ItemType Directory $p | Out-Null
          Push-Location $p
          try {
            $exe=Join-Path $env:RUNNER_TEMP 'anon-cli/pgextwin.exe'
            $log=& $exe download-all --pg all 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "ANONYMOUS_DEFAULT_LATEST=NO_GO; original error: $log" }
            if ($log -notmatch 'CATALOG_AUTH=SIGSTORE_VERIFIED_FEED') { throw 'ANONYMOUS_DEFAULT_LATEST=NO_GO; unsigned Catalog source' }
            $folders=@(Get-ChildItem -LiteralPath $p -Directory | Where-Object { $_.Name -cmatch '^pgextwin-pg[1-9][0-9]*-[1-9][0-9]*$' })
            if ($folders.Count -ne 1) { throw 'Expected exactly one signed PG cohort directory' }
            $folder=$folders[0].FullName
            $manifest=Get-Content -LiteralPath (Join-Path $folder 'DOWNLOAD-INFO.json') -Raw | ConvertFrom-Json
            $zipCount=[int]$manifest.zipCount
            if ($zipCount -lt 1 -or
                $log -notmatch "ZIP_COUNT=$zipCount\b") { throw 'ANONYMOUS_DEFAULT_LATEST=NO_GO; incomplete signed fleet batch' }
            if ($manifest.source -cne 'SIGSTORE_SIGNED_CATALOG_FEED_ORIGINAL_ZIPS' -or $manifest.releaseMetadataVerified -ne $false -or $manifest.signatureVerified -ne $false -or
                $manifest.installAuthorized -ne $false -or $manifest.verificationLevel -cne 'INTEGRITY_ONLY') {
              throw 'Untrusted output was incorrectly authorized'
            }
            $match=[regex]::Match($log, 'CATALOG_COMMIT=([0-9a-f]{40})')
            if (!$match.Success) { throw 'Missing signed feed source commit' }
            $source=$match.Groups[1].Value
            $cohort=Invoke-RestMethod -Uri "https://raw.githubusercontent.com/pgextwin/catalog/$source/config/cli-feed-majors.json"
            $approved=[string[]]@($cohort.postgresqlMajors)
            $actual=[string[]]@($manifest.packages | ForEach-Object { [string]$_.pgMajor } | Sort-Object -Unique)
            $extensions=[string[]]@($manifest.packages | ForEach-Object { [string]$_.extension } | Sort-Object -Unique)
            $pairs=@($manifest.packages | ForEach-Object { "$($_.extension)|$($_.pgMajor)" })
            if ($cohort.schemaVersion -ne 1 -or $approved.Count -lt 1 -or
                ($approved -join ',') -cne ($actual -join ',') -or
                $zipCount -ne ($approved.Count * $extensions.Count) -or
                @($pairs | Sort-Object -Unique).Count -ne $zipCount -or
                (Split-Path $folder -Leaf) -cne "pgextwin-pg$($approved[0])-$($approved[-1])") {
              throw 'Signed latest cohort and actual ZIP matrix differ'
            }
            $count=0
            foreach ($row in $manifest.packages) {
              $path=Join-Path $folder $row.relativePath
              if (!(Test-Path -LiteralPath $path)) { throw 'Anonymous ZIP absent' }
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $row.sha256) { throw 'Anonymous byte mismatch' }
              $count++
            }
            if ($count -ne $zipCount) { throw 'Anonymous wrong count' }
            Write-Output "ANONYMOUS_DEFAULT_LATEST=PASS SHA256=$count/$zipCount NO_TOKEN=true"
          } finally { Pop-Location }
