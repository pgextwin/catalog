name: Verify signed manual Release for all 14 extensions (read-only)

on:
  workflow_dispatch:
    inputs:
      extension:
        description: Exact allowlisted extension repository
        required: true
        type: choice
        options:
          - pg_bigm
          - pg_cron
          - pg_hint_plan
          - pgaudit
          - set_user
          - pg_repack
          - pg_ivm
          - pg_qualstats
          - plpgsql_check
          - hypopg
          - wal2json
          - pg_partman
          - pg_stat_monitor
          - orafce
      release_tag:
        description: An existing public signed operator-PUBLISH Release tag (never a candidate)
        required: true
        type: string

concurrency:
  group: catalog-verify-manual-${{ inputs.extension }}-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Rehash all public bytes, attest signatures and validate per-major source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    timeout-minutes: 50
    steps:
      - name: Check out trusted Catalog main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned-major Catalog schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Run fail-closed offline verifier tests
        run: python -m unittest discover -s tests -v
      - name: Independently verify immutable manual signed Release
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION: ${{ inputs.extension }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_signed_fleet_release.py \
            --extension "$EXTENSION" \
            --release-tag "$RELEASE_TAG" \
            --record-output "extensions/$EXTENSION.json" \
            | tee "$RUNNER_TEMP/verified-release-audit.json"
          echo "Verified signed public Release. The next protected Catalog PR must separately pass native validate CI; this workflow never pushes, merges or publishes." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate verified proposed Catalog record and immutable public sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/validate_landscape.py
          python scripts/validate_catalog.py
          python scripts/validate_catalog.py --verify-remote
      - name: Report no-App GitHub-only protected PR handoff (not an approval)
        env:
          EXTENSION: ${{ inputs.extension }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          {
            echo "## Verified public signed Release (read-only)"
            echo "Repository: pgextwin/$EXTENSION; tag: $RELEASE_TAG"
            echo "This run rehashed the public Release, independently verified its attestations, generated the proposed Catalog record, and passed all offline/schema/remote validators."
            echo "Download the verified-manual-release-record artifact; inspect the single extensions/$EXTENSION.json diff against current protected catalog/main."
            echo "An authenticated GitHub actor or connected Chat may propose that exact one-record change via a normal PR without installing a Catalog proposer App."
            echo "Require native protected Catalog PR CI at the exact head; merge only after SUCCESS, then confirm the Website's cross-repository public Pages audit."
            echo "This read-only run cannot create, authorize, merge or publish a Release or Catalog PR; no App, Secret or write permission is used."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Store proposed verified Catalog record (not a PR)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-manual-release-record
          path: |
            extensions/${{ inputs.extension }}.json
            ${{ runner.temp }}/verified-release-audit.json
          if-no-files-found: error
          retention-days: 14
