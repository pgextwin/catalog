name: Publish Sigstore-attested public Catalog ZIP selection feed

# This release contains METADATA ONLY for already approved Catalog entries.
# Never runs on PR content; starts from successful protected-main Validate.
on:
  workflow_run:
    workflows: ["Validate catalog"]
    types: [completed]
  pull_request:
    paths:
      - "config/cli-feed-majors.json"
      - "scripts/cli_signed_feed.py"
      - "tests/test_cli_signed_feed.py"
      - ".github/workflows/cli-signed-catalog-feed.yml"

permissions:
  contents: read

concurrency:
  group: pgextwin-signed-catalog-feed-release
  cancel-in-progress: false

jobs:
  pr-readonly-dryrun:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synthetics and protected Catalog-sized signed-feed plan without publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cli_signed_feed.py' -v
          python scripts/cli_signed_feed.py --catalog . --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/catalog-latest.json" --v2-output "$RUNNER_TEMP/catalog-latest-v2.json"
          echo 'CATALOG_FEED_PR_READONLY_DRYRUN=PASS NO_SIGN NO_TAG NO_RELEASE'
  gate:
    if: ${{ github.repository == 'pgextwin/catalog' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      source: ${{ steps.verify.outputs.source }}
    steps:
      - name: Independently require current protected Catalog main and successful exact-head Validate
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          branch="$(gh api repos/pgextwin/catalog/branches/main)"
          [[ "$(jq -r '.protected' <<< "$branch")" == true ]]
          [[ "$(jq -r '.commit.sha' <<< "$branch")" == "$RUN_SHA" ]] || { echo 'Main changed: deny feed'; exit 1; }
          run="$(gh api "repos/pgextwin/catalog/actions/runs/$RUN_ID")"
          jq -e --arg sha "$RUN_SHA" '.status=="completed" and .conclusion=="success" and .event=="push" and .head_branch=="main" and .run_attempt==1 and .head_sha==$sha' <<< "$run" >/dev/null
          commit="$(gh api "repos/pgextwin/catalog/commits/$RUN_SHA")"
          jq -e '.commit.verification.verified==true and .commit.verification.reason=="valid" and .committer.login=="web-flow" and .commit.committer.email=="noreply@github.com"' <<< "$commit" >/dev/null
          jobs="$(gh api --paginate "repos/pgextwin/catalog/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | [.name,.conclusion] | @tsv')"
          grep -Fx $'validate\tsuccess' <<< "$jobs" >/dev/null
          # Only protected Catalog roster/record changes OR an explicit
          # signed-feed PG cohort policy change may mint metadata-only feed.
          # Workflow/test-only and unrelated shadow merges remain NOOP.
          # Read the authenticated original GitHub commit's changed-file list.
          if ! jq -e '
            any(.files[]?;
                .filename == "config/cli-feed-majors.json" or
                .filename == "index.json" or
                (.filename | test("^extensions/[^/]+[.]json$")))
          ' <<< "$commit" >/dev/null; then
            echo "CATALOG_FEED_NOOP_NO_PUBLIC_RECORD_CHANGE NO_COHORT_CHANGE HEAD=$RUN_SHA PUBLISH_DENY"
            exit 0
          fi
          echo "source=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "CATALOG_FEED_GATE=PASS HEAD=$RUN_SHA ORIGINAL_VALIDATE_RUN=$RUN_ID"

  attest:
    needs: gate
    if: needs.gate.outputs.source != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Read exact approved commit without persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source }}
          persist-credentials: false
      - name: Build exact verified Catalog roster feed with independently scoped API token
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.gate.outputs.source }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cli_signed_feed.py' -v
          python scripts/cli_signed_feed.py --catalog . --commit "$SOURCE" \
            --output "$RUNNER_TEMP/catalog-latest.json" --v2-output "$RUNNER_TEMP/catalog-latest-v2.json"
          # Old CLIs reject available newer majors in the immutable records,
          # even with a rectangular v1 feed. Keep their last compatible release.
          stem=catalog-latest
          if [[ -f "$RUNNER_TEMP/catalog-latest-v2.json" ]]; then
            stem=catalog-latest-v2
          fi
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
      - name: Mint genuine Sigstore keyless signed Catalog-feed attestation on main
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/${{ steps.build.outputs.stem }}.json
      - name: Verify exact file via Sigstore (signer-workflow, source SHA, main-only)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.gate.outputs.source }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          STEM: ${{ steps.build.outputs.stem }}
        run: |
          set -euo pipefail
          test -f "$BUNDLE"
          cp "$BUNDLE" "$RUNNER_TEMP/$STEM.sigstore.json"
          gh attestation verify "$RUNNER_TEMP/$STEM.json" \
            --repo pgextwin/catalog --bundle "$BUNDLE" \
            --signer-workflow pgextwin/catalog/.github/workflows/cli-signed-catalog-feed.yml \
            --source-ref refs/heads/main --source-digest "$SOURCE" \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/verified.json"
          jq -e 'length>=1' "$RUNNER_TEMP/verified.json"
          echo 'CATALOG_FEED_SIGSTORE_VERIFIED=PASS PUBLISH=DENY_UNTIL_INDEPENDENT_JOB'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-catalog-feed
          path: |
            ${{ runner.temp }}/${{ steps.build.outputs.stem }}.json
            ${{ runner.temp }}/${{ steps.build.outputs.stem }}.sigstore.json
          if-no-files-found: error
          retention-days: 1

  publish-metadata-only:
    needs: [gate, attest]
    if: needs.gate.outputs.source != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: approved-catalog-feed
          path: ${{ runner.temp }}/verified-catalog-feed
      - name: Independently verify approved original feed and exact main before create-only publication
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.gate.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/verified-catalog-feed"
          stem="$(python - "$dir" "$SOURCE" <<'FEED_INVENTORY_PY'
          import sys,json
          from pathlib import Path
          directory,source=sys.argv[1:]
          directory=Path(directory)
          for stem in ("catalog-latest", "catalog-latest-v2"):
              feed=directory/(stem+".json")
              bundle=directory/(stem+".sigstore.json")
              if set(directory.iterdir())=={feed,bundle} and all(
                      p.is_file() and not p.is_symlink() for p in (feed,bundle)):
                  break
          else:
              sys.exit("Invalid signed feed artifact inventory")
          d=json.loads(feed.read_bytes())
          majors=d["postgresqlMajors"]
          optional=d.get("optionalPostgresqlMajor")
          v2=stem=="catalog-latest-v2"
          assert d["schemaVersion"]=="pgextwin-signed-catalog-zip-feed/v"+("2" if v2 else "1")
          assert d["catalogCommit"]==source and 14<=d["extensionCount"]<=128 and 1<=len(majors)<=12
          required_zip_count=len(majors)*d["extensionCount"]
          allowed=[majors]
          if v2:
              assert len(majors)<12 and int(majors[-1])<32 and optional==str(int(majors[-1])+1)
              allowed.append(majors+[optional])
              assert d["zipCount"]>required_zip_count
          else:
              assert "optionalPostgresqlMajor" not in d and d["zipCount"]==required_zip_count
          assert all([p["pgMajor"] for p in r["packages"]] in allowed for r in d["releases"])
          assert d["zipCount"]==sum(len(r["packages"]) for r in d["releases"])
          assert d["extensionSignatureVerified"] is False and d["publicationAuthorized"] is False and d["installAuthorized"] is False
          assert len(d["catalogSha256"])==d["extensionCount"]+1 and len(d["releases"])==d["extensionCount"]
          print(stem)
          FEED_INVENTORY_PY
          )"
          gh attestation verify "$dir/$stem.json" \
            --repo pgextwin/catalog --bundle "$dir/$stem.sigstore.json" \
            --signer-workflow pgextwin/catalog/.github/workflows/cli-signed-catalog-feed.yml \
            --source-ref refs/heads/main --source-digest "$SOURCE" \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/verified-signature.json"
          jq -e 'length>=1' "$RUNNER_TEMP/verified-signature.json"
          [[ "$(gh api repos/pgextwin/catalog/branches/main --jq .commit.sha)" == "$SOURCE" ]] || { echo 'Main advanced: refuse to publish stale feed'; exit 1; }
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo 'INDEPENDENT_PUBLISHER_FEED_SIGSTORE_VERIFIED=PASS'
      - name: Create-only draft -> rehash -> public metadata Release (never any extension Release)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.gate.outputs.source }}
          STEM: ${{ steps.verify.outputs.stem }}
        shell: bash
        run: |
          set -euo pipefail
          case "$STEM" in
            catalog-latest) tag="catalog-feed-$SOURCE"; latest=true; release_options=() ;;
            catalog-latest-v2) tag="catalog-feed-v2-$SOURCE"; latest=false; release_options=(--prerelease) ;;
            *) exit 1 ;;
          esac
          dir="$RUNNER_TEMP/verified-catalog-feed"
          python - "$dir/$STEM.json" "$RUNNER_TEMP/catalog-feed-notes.md" <<'FEED_NOTES_PY'
          import json,sys
          from pathlib import Path
          source,destination=map(Path,sys.argv[1:])
          feed=json.loads(source.read_text(encoding="utf-8"))
          count=feed["extensionCount"]
          majors=feed["postgresqlMajors"]
          optional=feed.get("optionalPostgresqlMajor")
          zip_count=feed["zipCount"]
          assert type(count) is int and 14<=count<=128
          assert type(majors) is list and 1<=len(majors)<=12
          assert all(type(m) is str and m.isascii() and m.isdigit() and 14<=int(m)<=32 and str(int(m))==m for m in majors)
          assert list(map(int,majors))==list(range(int(majors[0]),int(majors[0])+len(majors)))
          assert type(zip_count) is int
          if optional is None:
              assert zip_count==count*len(majors)
          else:
              assert count*len(majors)<zip_count<=count*(len(majors)+1)
          assert all(feed[key] is False for key in ("extensionSignatureVerified","publicationAuthorized","installAuthorized"))
          optional_en="" if optional is None else f" PostgreSQL {optional} is available for {zip_count-count*len(majors)} of these extensions."
          optional_ja="" if optional is None else f" PostgreSQL {optional} 向けは{zip_count-count*len(majors)}拡張で利用できます。"
          notes=("# pgextwin signed Catalog ZIP selection feed\n\n## English\n\n"
                 f"Metadata-only immutable selection of already-Catalog-approved {count} extensions and {zip_count} original ZIPs for PostgreSQL majors {', '.join(majors+[optional] if optional else majors)}.{optional_en} "
                 "Independently verifiable GitHub Actions Sigstore attestation is attached. Original extension ZIP bytes remain INTEGRITY_ONLY; this metadata-only feed does not grant an extension Release, installation or publication authorization.\n\n"
                 "## 日本語\n\n"
                 f"Catalogで承認・登録済みの{count}拡張について、PostgreSQL {'・'.join(majors+[optional] if optional else majors)}向けの元ZIP計{zip_count}件を選択する、不変のメタデータ専用Releaseです。{optional_ja}"
                 "独立して検証できるGitHub ActionsのSigstore Attestationが付属します。\n\n"
                 "個別の拡張ZIPの検証状態はINTEGRITY_ONLYです。このメタデータには、原本ZIPの真正署名の検証や、新規Release・インストール・配布／公開の認可を意味する効力はありません。\n")
          destination.write_text(notes,encoding="utf-8")
          FEED_NOTES_PY
          gh api --method POST repos/pgextwin/catalog/git/refs -f "ref=refs/tags/$tag" -f "sha=$SOURCE"
          gh release create "$tag" "$dir/$STEM.json" "$dir/$STEM.sigstore.json" \
            --repo pgextwin/catalog --verify-tag --draft --latest=false "${release_options[@]}" \
            --title "pgextwin Catalog signed ZIP feed $SOURCE" \
            --notes-file "$RUNNER_TEMP/catalog-feed-notes.md"
          mkdir -p "$RUNNER_TEMP/feed-draft-audit"
          gh release download "$tag" --repo pgextwin/catalog --pattern "$STEM.*" --dir "$RUNNER_TEMP/feed-draft-audit"
          for name in "$STEM.json" "$STEM.sigstore.json"; do
            cmp "$dir/$name" "$RUNNER_TEMP/feed-draft-audit/$name"
          done
          gh release edit "$tag" --repo pgextwin/catalog --draft=false --latest="$latest" "${release_options[@]}"

          # Advance discovery only after the release and both rehashed assets are public.
          # Once created, it also advances on v1-only releases so v2 cannot go stale.
          ref="heads/catalog-feed-v2-current"
          refs="$(gh api "repos/pgextwin/catalog/git/matching-refs/$ref")"
          if jq -e --arg ref "refs/$ref" 'any(.[]; .ref == $ref)' <<< "$refs" >/dev/null; then
            gh api --method PATCH "repos/pgextwin/catalog/git/refs/$ref" -f "sha=$SOURCE" -F force=false
          elif [[ "$latest" == false ]]; then
            gh api --method POST repos/pgextwin/catalog/git/refs -f "ref=refs/$ref" -f "sha=$SOURCE"
          fi
          echo "CATALOG_SIGNED_FEED_METADATA_ONLY_PUBLISHED=PASS TAG=$tag"
