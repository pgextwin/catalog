name: Propose fully verified manual signed Release to Catalog (17 verifier identities; opt-in)

on:
  schedule:
    # Reuse the existing signed asset verifier, not a second Catalog writer.
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
    # Reuse the exact independent signed-Release allowlist; do not keep a separate
    # manually maintained list of extension names in workflow inputs.
      extension:
        description: Exactly one registered pgextwin extension (verified against protected source identity registry)
        required: true
        type: string
      release_tag:
        description: Already public and operator-PUBLISH signed Release tag
        required: true
        type: string

concurrency:
  group: catalog-propose-verified-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover only new public stable Release tags (never signs or publishes)
    if: github.repository == 'pgextwin/catalog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.delta.outputs.targets }}
      has_changes: ${{ steps.delta.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Validate deterministic signed reconciliation controls
        run: python tests/test_catalog_auto_delta.py
      - name: Detect drift but never authorize a Catalog record
        id: delta
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_EXTENSION: ${{ inputs.extension }}
          REQUEST_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python scripts/catalog_auto_delta.py --manual-extension "$REQUEST_EXTENSION" --manual-tag "$REQUEST_TAG"
          else
            python scripts/catalog_auto_delta.py
          fi
  propose:
    name: Independent exact-asset audit then optional App-owned Catalog record PR
    needs: discover
    if: github.ref == 'refs/heads/main' && needs.discover.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Checkout trusted Catalog main without persistent write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install Catalog JSON schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Rehash all signed assets and independently authorize one Catalog record
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION: ${{ matrix.extension }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "extensions/$EXTENSION.json" ]]; then
            echo "base_record_sha=$(git hash-object "extensions/$EXTENSION.json")" >> "$GITHUB_OUTPUT"
          else
            echo "base_record_sha=MISSING" >> "$GITHUB_OUTPUT"
          fi
          echo "base_index_sha=$(git hash-object index.json)" >> "$GITHUB_OUTPUT"
          echo "base_landscape_index_sha=$(git hash-object landscape/index.json)" >> "$GITHUB_OUTPUT"
          if [[ -f "landscape/extensions/$EXTENSION.json" ]]; then
            echo "base_landscape_record_sha=$(git hash-object "landscape/extensions/$EXTENSION.json")" >> "$GITHUB_OUTPUT"
          else
            echo "base_landscape_record_sha=MISSING" >> "$GITHUB_OUTPUT"
          fi
          python scripts/verify_signed_fleet_release.py \
            --extension "$EXTENSION" --release-tag "$RELEASE_TAG" \
            --record-output "extensions/$EXTENSION.json" \
            | tee "$RUNNER_TEMP/verified-catalog-record.json"
      - name: Update index only after complete signed first-Release verification
        if: steps.verify.outputs.changed == 'true'
        env:
          EXTENSION: ${{ matrix.extension }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.verified_release_record import FIRST_RELEASE_SOURCES
          name = os.environ["EXTENSION"]
          path = Path("index.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          names = data["extensions"]
          if name not in names:
              if name not in FIRST_RELEASE_SOURCES:
                  raise SystemExit("DENY: unknown first-Release Catalog identity")
              if not (Path("extensions") / (name + ".json")).is_file():
                  raise SystemExit("DENY: verifier did not generate the signed record")
              record = json.loads((Path("extensions") / (name + ".json")).read_text(encoding="utf-8"))
              if record.get("name") != name or record.get("schemaVersion") != 2:
                  raise SystemExit("DENY: verified record identity mismatch")
              registry_index = Path("landscape/index.json")
              registry = json.loads(registry_index.read_text(encoding="utf-8"))
              registry_path = Path("landscape/extensions") / (name + ".json")
              landscape = (json.loads(registry_path.read_text(encoding="utf-8"))
                           if registry_path.is_file() else {})
              landscape.update(
                  schemaVersion=1, name=name, displayName=record["displayName"],
                  description=record["description"],
                  upstreamRepository=record["upstream"]["repository"],
                  status="implemented", pgextwinCatalogName=name,
                  lastReviewed=record["latest"]["publishedAt"][:10],
                  evidenceUrls=[record["latest"]["releaseUrl"],
                                "https://github.com/" + record["upstream"]["repository"]],
                  windowsBinarySources=[])
              for key in ("candidateRationale", "roadmap", "notPlannedReason",
                          "notPlannedReasonJa", "reasonCode"):
                  landscape.pop(key, None)
              registry["extensions"] = sorted(set(registry["extensions"]) | {name})
              registry_path.write_text(json.dumps(landscape, indent=2) + "\n", encoding="utf-8")
              registry_index.write_text(json.dumps(registry, indent=2) + "\n", encoding="utf-8")
              names.append(name)
              data["extensions"] = sorted(names)
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Validate proposed record against Catalog schema and live sources
        if: steps.verify.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/validate_landscape.py
          python scripts/validate_catalog.py
          python scripts/validate_catalog.py --verify-remote
      - name: Preserve immutable verification evidence (never a Release asset)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-catalog-proposal
          path: |
            extensions/${{ matrix.extension }}.json
            index.json
            landscape/index.json
            landscape/extensions/${{ matrix.extension }}.json
            ${{ runner.temp }}/verified-catalog-record.json
          if-no-files-found: error
          retention-days: 14
      - name: Create narrow Catalog proposer App token only after verification
        id: proposer-token
        if: steps.verify.outputs.changed == 'true' && vars.PGEXTWIN_CATALOG_PROPOSER_ENABLED == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PGEXTWIN_CATALOG_PROPOSER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PGEXTWIN_CATALOG_PROPOSER_APP_PRIVATE_KEY }}
          owner: pgextwin
          repositories: catalog
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout trusted Catalog main with dedicated App (no untrusted PR code)
        if: steps.proposer-token.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: proposed
          token: ${{ steps.proposer-token.outputs.token }}
          persist-credentials: true
      - name: Create immutable verified-record PR with native PR CI (never auto-merge)
        if: steps.proposer-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.proposer-token.outputs.token }}
          EXTENSION: ${{ matrix.extension }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          BASE_RECORD_SHA: ${{ steps.verify.outputs.base_record_sha }}
          BASE_INDEX_SHA: ${{ steps.verify.outputs.base_index_sha }}
          BASE_LANDSCAPE_INDEX_SHA: ${{ steps.verify.outputs.base_landscape_index_sha }}
          BASE_LANDSCAPE_RECORD_SHA: ${{ steps.verify.outputs.base_landscape_record_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd proposed
          branch="auto-catalog/$EXTENSION-$RELEASE_TAG"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Catalog proposal branch already exists; do not overwrite or duplicate it."
            exit 1
          fi
          if [[ "$(git hash-object index.json)" != "$BASE_INDEX_SHA" ]]; then
            echo "::error::Catalog index changed after verification; refuse stale overwrite"
            exit 1
          fi
          if [[ "$BASE_RECORD_SHA" == MISSING ]]; then
            if [[ -e "extensions/$EXTENSION.json" ]]; then
              echo "::error::First Catalog record unexpectedly exists; deny overwrite"
              exit 1
            fi
          elif [[ ! -f "extensions/$EXTENSION.json" || "$(git hash-object "extensions/$EXTENSION.json")" != "$BASE_RECORD_SHA" ]]; then
            echo "::error::Catalog main record changed after signed verification; refuse stale overwrite"
            exit 1
          fi
          if [[ "$BASE_RECORD_SHA" == MISSING ]]; then
            [[ "$(git hash-object landscape/index.json)" == "$BASE_LANDSCAPE_INDEX_SHA" ]] || { echo 'Landscape index changed; refuse stale overwrite'; exit 1; }
            if [[ "$BASE_LANDSCAPE_RECORD_SHA" == MISSING ]]; then
              [[ ! -e "landscape/extensions/$EXTENSION.json" ]] || exit 1
            else
              [[ "$(git hash-object "landscape/extensions/$EXTENSION.json")" == "$BASE_LANDSCAPE_RECORD_SHA" ]] || exit 1
            fi
            cp ../landscape/index.json landscape/index.json
            cp "../landscape/extensions/$EXTENSION.json" "landscape/extensions/$EXTENSION.json"
          fi
          cp "../extensions/$EXTENSION.json" "extensions/$EXTENSION.json"
          cp ../index.json index.json
          git switch -c "$branch"
          git config user.name "pgextwin-catalog-proposer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "extensions/$EXTENSION.json" index.json
          if [[ "$BASE_RECORD_SHA" == MISSING ]]; then
            git add -- "landscape/extensions/$EXTENSION.json" landscape/index.json
          fi
          actual="$(git diff --cached --name-only)"
          expected="extensions/$EXTENSION.json"
          if [[ "$BASE_RECORD_SHA" == MISSING ]]; then
            # Landscape may already list a prospective extension: no phantom
            # change to landscape/index.json is permitted in that case.
            expected="$(printf 'extensions/%s.json\nindex.json\nlandscape/extensions/%s.json' "$EXTENSION" "$EXTENSION")"
            if ! git diff --cached --quiet -- landscape/index.json; then
              expected="$expected"$'\n'"landscape/index.json"
            fi
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Catalog PR files not exactly the verified record and permitted initial index"
            exit 1
          fi
          git commit -m "catalog: verified operator release $EXTENSION $RELEASE_TAG"
          git push -u origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "catalog: verified $EXTENSION $RELEASE_TAG" \
            --body "Independent public ZIP/SPDX/Grype SHA256 rehash, GitHub attestations, full per-major source SHA pins, main-only operator-PUBLISH workflow and Catalog validators passed. This is a proposal ONLY. Protected native PR validate must pass at exact head before any merge. No auto-Release or auto-merge."
          echo "Created App-owned signed Catalog PR; pending native protected PR CI and review of verification evidence." >> "$GITHUB_STEP_SUMMARY"
      - name: Report record unchanged or proposer deliberately disabled
        if: steps.verify.outputs.changed != 'true' || vars.PGEXTWIN_CATALOG_PROPOSER_ENABLED != 'true'
        env:
          CHANGED: ${{ steps.verify.outputs.changed }}
          ENABLED: ${{ vars.PGEXTWIN_CATALOG_PROPOSER_ENABLED }}
        run: |
          echo "Signed Release verification completed. Record changed=$CHANGED; App-based PR proposer enabled=$ENABLED. No Catalog PR was pushed by this run." >> "$GITHUB_STEP_SUMMARY"
