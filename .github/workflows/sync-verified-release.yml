name: Propose fully verified manual signed Release to Catalog (17 verifier identities; opt-in)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
    # Reuse the exact independent signed-Release allowlist; do not keep a separate
    # manually maintained list of extension names in workflow inputs.
      extension:
        description: Exactly one registered pgextwin extension (verified against protected source identity registry)
        required: true
        type: string
      release_tag:
        description: Already public and operator-PUBLISH signed Release tag
        required: true
        type: string

concurrency:
  group: catalog-propose-verified-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover only new public stable Release tags (never signs or publishes)
    if: >-
      ${{ github.repository == 'pgextwin/catalog' && github.ref == 'refs/heads/main' &&
          (github.event_name != 'issue_comment' ||
           (github.event.issue.number == 184 && github.actor == 'ShutenOishi' &&
            github.triggering_actor == 'ShutenOishi' &&
            startsWith(github.event.comment.body, '/pgextwin catalog '))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      targets: ${{ steps.delta.outputs.targets }}
      has_changes: ${{ steps.delta.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Validate deterministic signed reconciliation controls
        run: python tests/test_catalog_auto_delta.py
      - name: Authenticate owner Issue #184 Catalog request (NO WRITE)
        if: github.event_name == 'issue_comment'
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/catalog-owner-command.py --github-output "$GITHUB_OUTPUT"
      - name: Detect drift but never authorize a Catalog record
        id: delta
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_EXTENSION: ${{ steps.owner.outputs.extension || inputs.extension }}
          REQUEST_TAG: ${{ steps.owner.outputs.release_tag || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            python scripts/catalog_auto_delta.py --manual-extension "$REQUEST_EXTENSION" --manual-tag "$REQUEST_TAG"
          else
            python scripts/catalog_auto_delta.py
          fi
  propose:
    name: Independent exact-asset audit then optional App-owned Catalog record PR
    needs: discover
    if: github.ref == 'refs/heads/main' && needs.discover.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Checkout trusted Catalog main without persistent write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install Catalog JSON schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Rehash all signed assets and independently authorize one Catalog record
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION: ${{ matrix.extension }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "packages/$EXTENSION.json" ]]; then
            echo "base_ledger_sha=$(git hash-object "packages/$EXTENSION.json")" >> "$GITHUB_OUTPUT"
          else
            echo "base_ledger_sha=MISSING" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "identities/$EXTENSION.json" ]]; then
            echo "base_identity_sha=$(git hash-object "identities/$EXTENSION.json")" >> "$GITHUB_OUTPUT"
          else
            echo "base_identity_sha=MISSING" >> "$GITHUB_OUTPUT"
          fi
          echo "base_index_sha=$(git hash-object index.json)" >> "$GITHUB_OUTPUT"
          python scripts/verify_signed_fleet_release.py \
            --extension "$EXTENSION" --release-tag "$RELEASE_TAG" \
            --record-output "packages/$EXTENSION.json" \
            | tee "$RUNNER_TEMP/verified-catalog-record.json"
      - name: Update index only after complete signed first-Release verification
        if: steps.verify.outputs.changed == 'true'
        env:
          EXTENSION: ${{ matrix.extension }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.package_ledger import json_bytes, read_record
          from scripts.verified_release_record import FIRST_RELEASE_SOURCES
          from scripts.verified_release_record import (
              Denied, project_first_intake_files, read_index_v3,
          )
          name = os.environ["EXTENSION"]
          index_path = Path("index.json")
          data = read_index_v3(index_path)
          names = data["extensions"]
          if name not in names:
              if name not in FIRST_RELEASE_SOURCES:
                  raise SystemExit("DENY: unknown first-Release Catalog identity")
              ledger_path = Path("packages") / (name + ".json")
              if not ledger_path.is_file():
                  raise SystemExit("DENY: verifier did not generate the signed ledger")
              ledger = read_record(ledger_path)
              if ledger.get("name") != name or ledger.get("schemaVersion") != 1:
                  raise SystemExit("DENY: verified ledger identity mismatch")
              evidence_path = Path(os.environ["RUNNER_TEMP"]) / "verified-catalog-record.json"
              evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
              try:
                  projected = project_first_intake_files(
                      name,
                      ledger,
                      expected_identity_blob_sha=evidence.get("identityBlobSha"),
                  )
              except (Denied, ValueError, KeyError, TypeError, OSError) as exc:
                  raise SystemExit(f"DENY: {exc}") from exc
              for rel_path, doc in projected.items():
                  target = Path(rel_path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(json_bytes(doc))
          PY
      - name: Validate proposed Catalog and Landscape locally
        if: steps.verify.outputs.changed == 'true'
        run: |
          python scripts/validate_landscape.py
          python scripts/validate_catalog.py
      - name: Stage verified Catalog proposal artifact
        env:
          EXTENSION: ${{ matrix.extension }}
          CHANGED: ${{ steps.verify.outputs.changed }}
          BASE_IDENTITY_SHA: ${{ steps.verify.outputs.base_identity_sha }}
          BASE_INDEX_SHA: ${{ steps.verify.outputs.base_index_sha }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/verified-catalog-proposal"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$RUNNER_TEMP/verified-catalog-record.json" "$stage/verified-catalog-record.json"
          if [[ "$CHANGED" == "true" ]]; then
            mkdir -p "$stage/packages"
            cp "packages/$EXTENSION.json" "$stage/packages/$EXTENSION.json"
            if [[ -f "identities/$EXTENSION.json" ]]; then
              actual_id_sha="$(git hash-object "identities/$EXTENSION.json")"
              if [[ "$actual_id_sha" != "$BASE_IDENTITY_SHA" ]]; then
                mkdir -p "$stage/identities"
                cp "identities/$EXTENSION.json" "$stage/identities/$EXTENSION.json"
              fi
            fi
            actual_idx_sha="$(git hash-object index.json)"
            if [[ "$actual_idx_sha" != "$BASE_INDEX_SHA" ]]; then
              cp index.json "$stage/index.json"
            fi
          fi
      - name: Preserve immutable verification evidence (never a Release asset)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-catalog-proposal
          path: ${{ runner.temp }}/verified-catalog-proposal
          if-no-files-found: error
          retention-days: 14
      - name: Create narrow Catalog proposer App token only after verification
        id: proposer-token
        if: steps.verify.outputs.changed == 'true' && vars.PGEXTWIN_CATALOG_PROPOSER_ENABLED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PGEXTWIN_CATALOG_PROPOSER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PGEXTWIN_CATALOG_PROPOSER_APP_PRIVATE_KEY }}
          owner: pgextwin
          repositories: catalog
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout trusted Catalog main with dedicated App (no untrusted PR code)
        if: steps.proposer-token.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: proposed
          token: ${{ steps.proposer-token.outputs.token }}
          persist-credentials: true
      - name: Create immutable verified-record PR with native PR CI (never auto-merge)
        if: steps.proposer-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.proposer-token.outputs.token }}
          EXTENSION: ${{ matrix.extension }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          BASE_LEDGER_SHA: ${{ steps.verify.outputs.base_ledger_sha }}
          BASE_IDENTITY_SHA: ${{ steps.verify.outputs.base_identity_sha }}
          BASE_INDEX_SHA: ${{ steps.verify.outputs.base_index_sha }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/verified-catalog-proposal"
          recorded_id_sha="$(python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); v=d.get("identityBlobSha"); print("MISSING" if v is None else v)' "$stage/verified-catalog-record.json")"
          if [[ "$recorded_id_sha" != "$BASE_IDENTITY_SHA" ]]; then
            echo "::error::Verification identityBlobSha disagrees with base identity snapshot; refuse proposal"
            exit 1
          fi
          cd proposed
          branch="auto-catalog/$EXTENSION-$RELEASE_TAG"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Catalog proposal branch already exists; do not overwrite or duplicate it."
            exit 1
          fi
          if [[ "$(git hash-object index.json)" != "$BASE_INDEX_SHA" ]]; then
            echo "::error::Catalog v3 index changed after verification; refuse stale overwrite"
            exit 1
          fi
          if [[ "$BASE_LEDGER_SHA" == MISSING ]]; then
            if [[ -e "packages/$EXTENSION.json" ]]; then
              echo "::error::First Catalog ledger unexpectedly exists; deny overwrite"
              exit 1
            fi
          elif [[ ! -f "packages/$EXTENSION.json" || "$(git hash-object "packages/$EXTENSION.json")" != "$BASE_LEDGER_SHA" ]]; then
            echo "::error::Catalog main ledger changed after signed verification; refuse stale overwrite"
            exit 1
          fi
          if [[ "$recorded_id_sha" == MISSING ]]; then
            if [[ -e "identities/$EXTENSION.json" ]]; then
              echo "::error::Catalog main identity unexpectedly appeared after verification; refuse stale proposal"
              exit 1
            fi
          elif [[ ! -f "identities/$EXTENSION.json" || -L "identities/$EXTENSION.json" || "$(git hash-object "identities/$EXTENSION.json")" != "$recorded_id_sha" ]]; then
            echo "::error::Catalog main identity blob changed after verification; refuse stale overwrite"
            exit 1
          fi
          cp "$stage/packages/$EXTENSION.json" "packages/$EXTENSION.json"
          staged_candidates=("packages/$EXTENSION.json")
          if [[ -f "$stage/identities/$EXTENSION.json" ]]; then
            if [[ "$BASE_LEDGER_SHA" != MISSING ]]; then
              echo "::error::Existing-extension update must not modify identities/$EXTENSION.json"
              exit 1
            fi
            cp "$stage/identities/$EXTENSION.json" "identities/$EXTENSION.json"
            staged_candidates+=("identities/$EXTENSION.json")
          fi
          if [[ -f "$stage/index.json" ]]; then
            if [[ "$BASE_LEDGER_SHA" != MISSING ]]; then
              echo "::error::Existing-extension update must not modify index.json"
              exit 1
            fi
            cp "$stage/index.json" "index.json"
            staged_candidates+=("index.json")
          elif [[ "$BASE_LEDGER_SHA" == MISSING ]]; then
            echo "::error::First Catalog release requires updated index.json"
            exit 1
          fi
          git switch -c "$branch"
          git config user.name "pgextwin-catalog-proposer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${staged_candidates[@]}"
          actual="$(git diff --cached --name-only)"
          expected_paths=("packages/$EXTENSION.json")
          if [[ "$BASE_LEDGER_SHA" == MISSING ]]; then
            if [[ -f "$stage/identities/$EXTENSION.json" ]] && ! git diff --cached --quiet -- "identities/$EXTENSION.json"; then
              expected_paths+=("identities/$EXTENSION.json")
            fi
            if ! git diff --cached --quiet -- index.json; then
              expected_paths+=("index.json")
            fi
          fi
          expected="$(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Catalog PR files not exactly the verified ledger and permitted initial identity/index"
            exit 1
          fi
          git commit -m "catalog: verified operator release $EXTENSION $RELEASE_TAG"
          git push -u origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "catalog: verified $EXTENSION $RELEASE_TAG" \
            --body "Independent public ZIP/SPDX/Grype SHA256 rehash, GitHub attestations, full per-major source SHA pins, main-only operator-PUBLISH workflow and Catalog validators passed. This is a proposal ONLY. Protected native PR validate must pass at exact head before any merge. No auto-Release or auto-merge."
          echo "Created App-owned signed Catalog PR; pending native protected PR CI and review of verification evidence." >> "$GITHUB_STEP_SUMMARY"
      - name: Report record unchanged or proposer deliberately disabled
        if: steps.verify.outputs.changed != 'true' || vars.PGEXTWIN_CATALOG_PROPOSER_ENABLED != 'true'
        env:
          CHANGED: ${{ steps.verify.outputs.changed }}
          ENABLED: ${{ vars.PGEXTWIN_CATALOG_PROPOSER_ENABLED }}
        run: |
          echo "Signed Release verification completed. Record changed=$CHANGED; App-based PR proposer enabled=$ENABLED. No Catalog PR was pushed by this run." >> "$GITHUB_STEP_SUMMARY"
