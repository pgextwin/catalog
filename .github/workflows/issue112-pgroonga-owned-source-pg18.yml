name: Issue112 PGroonga pgextwin-owned pinned source PG18 (PRIVATE)
on:
  pull_request:
    paths:
      - scripts/issue112_pgroonga_owned_source_gate.py
      - scripts/issue112-pgroonga-owned-source-runtime.ps1
      - tests/test_issue112_pgroonga_owned_source_gate.py
      - docs/issue-112-pgroonga-owned-source-pg18.md
      - .github/workflows/issue112-pgroonga-owned-source-pg18.yml
  push:
    branches: [main]
    paths:
      - scripts/issue112_pgroonga_owned_source_gate.py
      - scripts/issue112-pgroonga-owned-source-runtime.ps1
      - tests/test_issue112_pgroonga_owned_source_gate.py
      - docs/issue-112-pgroonga-owned-source-pg18.md
      - .github/workflows/issue112-pgroonga-owned-source-pg18.yml
permissions:
  contents: read
jobs:
  pinned-signed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hostile offline source-gate tests
        run: python3 -m unittest discover -s tests -p test_issue112_pgroonga_owned_source_gate.py -v
      - name: Verify exact upstream source ZIP + official Groonga detached signature
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          trap 'rm -f groonga-16.1.3.zip groonga-16.1.3.zip.asc official-key.asc official-key.gpg verify.status; rm -rf -- "$RUNNER_TEMP/gpg-import" "$RUNNER_TEMP/gpg-verify"' EXIT
          source_url=https://github.com/groonga/groonga/releases/download/v16.1.3
          for name in groonga-16.1.3.zip groonga-16.1.3.zip.asc; do
            curl --fail --silent --show-error --location --max-redirs 3 \
              --proto '=https' --proto-redir '=https' --retry 2 --max-time 150 \
              --output "$name" "$source_url/$name"
          done
          test "$(stat -c %s groonga-16.1.3.zip)" = 136286598
          echo 'ad892560511e5886dea2373101f0780e0a16394d30e5a20a8d3df12d7ef9e85d  groonga-16.1.3.zip' | sha256sum -c -
          test "$(stat -c %s groonga-16.1.3.zip.asc)" = 833
          echo 'edc58ee987bf8ef92436a7c11373ddb382af4063d59aac8bd2c4943f65223848  groonga-16.1.3.zip.asc' | sha256sum -c -
          curl --fail --silent --show-error --location --max-redirs 3 \
            --proto '=https' --proto-redir '=https' --max-time 30 \
            --output official-key.asc https://packages.groonga.org/debian/groonga-archive-keyring.asc
          mkdir -m 700 "$RUNNER_TEMP/gpg-import" "$RUNNER_TEMP/gpg-verify"
          fingerprint=2701F317CFCCCB975CADE9C2624CF77434839225
          gpg --homedir "$RUNNER_TEMP/gpg-import" --batch --import official-key.asc
          gpg --homedir "$RUNNER_TEMP/gpg-import" --batch --with-colons --fingerprint --list-keys "$fingerprint" |
            awk -F: '$1 == "fpr" {print $10}' | grep -Fx "$fingerprint"
          gpg --homedir "$RUNNER_TEMP/gpg-import" --batch --export "$fingerprint" > official-key.gpg
          gpg --homedir "$RUNNER_TEMP/gpg-verify" --batch --import official-key.gpg
          gpg --homedir "$RUNNER_TEMP/gpg-verify" --batch --status-fd 1 \
            --verify groonga-16.1.3.zip.asc groonga-16.1.3.zip | tee verify.status
          grep -F '[GNUPG:] VALIDSIG 2701F317CFCCCB975CADE9C2624CF77434839225 ' verify.status
          echo 'GROONGA_NEW_SOURCE_ZIP_SHA256_AND_OPENPGP=PASS NOT_HISTORICAL_INPUT=true PUBLIC_GET=DENY'
  owned-source-windows-pg18:
    needs: pinned-signed-source
    runs-on: windows-latest
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - name: Preserve exact upstream Git source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned PGroonga 4.1.0 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgroonga/pgroonga
          ref: 47d0252f76dccbdc2ebeee9ed6cf941dd9552bcc
          path: pinned-pgroonga
          persist-credentials: false
      - name: Checkout known-good shared installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 1906c7203d5b0c98cf1da705d4a70d496ad930e9
          path: build-tools
          persist-credentials: false
      - name: Install real PG18 Windows server with tested helper
        shell: pwsh
        run: ./build-tools/scripts/install-postgresql.ps1 -Major 18 -ChocolateyPackage postgresql18 -ChocolateyVersion 18.6.5 -TestPort 55463
      - name: GET, independently hash and unpack immutable source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/groonga/groonga/releases/download/v16.1.3'
          foreach ($name in @('groonga-16.1.3.zip','groonga-16.1.3.zip.asc')) {
            & curl.exe --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 --output (Join-Path $env:RUNNER_TEMP $name) "$base/$name"
            if ($LASTEXITCODE -ne 0) { throw "Pinned source GET failed: $name" }
          }
          & python scripts/issue112_pgroonga_owned_source_gate.py --zip (Join-Path $env:RUNNER_TEMP 'groonga-16.1.3.zip') --asc (Join-Path $env:RUNNER_TEMP 'groonga-16.1.3.zip.asc') --pgroonga-root pinned-pgroonga
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source ZIP/Git SHA gate failed' }
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'groonga-16.1.3.zip') -DestinationPath $env:RUNNER_TEMP
          if (-not (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'groonga-16.1.3/CMakeLists.txt') -PathType Leaf)) { throw 'Source extraction failed' }
          "PGEXTWIN_OWNED_PREFIX=$env:RUNNER_TEMP\pgroonga-owned-prefix" >> $env:GITHUB_ENV
      - name: Use upstream tested CMake workaround and Meson
        shell: pwsh
        run: |
          choco install -y cmake --version=4.3.4 --force
          if ($LASTEXITCODE -notin @(0,1641,3010)) { throw 'CMake unavailable' }
          choco install -y meson
          if ($LASTEXITCODE -notin @(0,1641,3010)) { throw 'Meson unavailable' }
          'C:\Program Files\Meson' >> $env:GITHUB_PATH
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC compiler unavailable' }
          "VC_PREFIX=$vs\VC" >> $env:GITHUB_ENV
          Copy-Item -Path pinned-pgroonga/cmake -Destination (Join-Path $env:PGROOT 'lib') -Recurse -ErrorAction Stop
      - name: CMake compile signed Groonga source (new output bytes)
        shell: cmd
        run: |
          call "%VC_PREFIX%\Auxiliary\Build\vcvars64.bat"
          cmake -B "%RUNNER_TEMP%\groonga.build" -G Ninja -S "%RUNNER_TEMP%\groonga-16.1.3" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="%PGEXTWIN_OWNED_PREFIX%" -DGRN_BUNDLED_MESSAGE_PACK_SHARED=ON -DGRN_WITH_MECAB=bundled -DGRN_WITH_MESSAGE_PACK=bundled -DGRN_WITH_MRUBY=yes -DGRN_WITH_RAPIDJSON=bundled -DGRN_WITH_XXHASH=bundled -DGRN_WITH_ZSTD=bundled -Dlz4_ROOT="%PGROOT%\lib\cmake"
          if errorlevel 1 exit /b 1
          cmake --build "%RUNNER_TEMP%\groonga.build" --parallel 2
          if errorlevel 1 exit /b 1
          cmake --install "%RUNNER_TEMP%\groonga.build"
          if errorlevel 1 exit /b 1
      - name: MSVC compile pinned PGroonga commit (separate source identity)
        shell: cmd
        working-directory: pinned-pgroonga
        run: |
          call "%VC_PREFIX%\Auxiliary\Build\vcvars64.bat"
          set "PATH=%PGROOT%\bin;%PGEXTWIN_OWNED_PREFIX%\bin;C:\Program Files\Meson;%PATH%"
          meson setup --buildtype=release --cmake-prefix-path="%PGEXTWIN_OWNED_PREFIX%" --prefix="%PGEXTWIN_OWNED_PREFIX%" -Dinstall_to_postgresql=false "%RUNNER_TEMP%\pgroonga.build"
          if errorlevel 1 exit /b 1
          meson compile -C "%RUNNER_TEMP%\pgroonga.build"
          if errorlevel 1 exit /b 1
          meson install -C "%RUNNER_TEMP%\pgroonga.build"
          if errorlevel 1 exit /b 1
      - name: Real PG18 server indexed SQL smoke using newly compiled bytes
        shell: pwsh
        run: ./scripts/issue112-pgroonga-owned-source-runtime.ps1 -Major 18
      - name: Never upload, sign, admit or publish preview binaries
        if: always()
        shell: pwsh
        run: Write-Host 'PGROONGA_NEW_OWNED_SOURCE=PRIVATE ORIGINAL_ASSET_UNCHANGED=true SOURCE_NOTICE=DENY COMPILER_ATTESTATION=DENY ZIP_UPLOAD=NONE PUBLIC_GET=DENY MIRROR=DENY RELEASE=DENY PUBLISH=DENY'
