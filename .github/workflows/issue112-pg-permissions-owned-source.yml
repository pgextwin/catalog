name: Issue112 pg_permissions source-owned SQL candidate (NONPUBLISHING)

on:
  pull_request:
    paths:
      - scripts/issue112_sql_owned_archive.py
      - scripts/issue112_pg_permissions_source_pins.py
      - scripts/issue112_pg_permissions_owned_source_pilot.py
      - scripts/issue112-pg-permissions-owned-source-windows.ps1
      - docs/issue-112-pg-permissions-source-owned-private.md
      - tests/test_issue112_pg_permissions_owned_source_pilot.py
      - tests/test_issue112_pg_permissions_private_sbom.py
      - scripts/issue112_pg_permissions_private_sbom.py
      - .github/workflows/issue112-pg-permissions-owned-source.yml

permissions:
  contents: read

jobs:
  original-source-private-windows-package:
    if: github.event_name == 'pull_request' && github.repository == 'pgextwin/catalog'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout the PR without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact upstream immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cybertec-postgresql/pg_permissions
          ref: 3360447e0668fed2b9db6a0ae1d086533781f9bd
          path: pinned-pg-permissions
          persist-credentials: false
      - name: Restore canonical upstream Git blob bytes on Windows (no CRLF conversion)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C pinned-pg-permissions config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot disable CRLF transformation' }
          git -C pinned-pg-permissions config core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select canonical Git LF' }
          git -C pinned-pg-permissions checkout-index --all --force
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore immutable Git blob bytes' }
      - name: Offline hostile tests and genuine original source package receipts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -p 'test_issue112_pg_permissions_owned_source_pilot.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Private package adversarial tests failed' }
          python -m unittest discover -s tests -p 'test_issue112_pg_permissions_private_sbom.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Private SPDX hostile tests failed' }
          $sha = (& git -C pinned-pg-permissions rev-parse HEAD).Trim()
          if ($sha -cne '3360447e0668fed2b9db6a0ae1d086533781f9bd') { throw 'Unexpected upstream source commit' }
          $dir = Join-Path $env:RUNNER_TEMP 'permissions-private-only'
          [void](New-Item -ItemType Directory -Path $dir)
          $hashes = @()
          foreach ($pg in @('14', '15', '16', '17', '18')) {
            $zip = Join-Path $dir "pg_permissions-source-pg$pg.zip"
            python scripts/issue112_pg_permissions_owned_source_pilot.py --source pinned-pg-permissions --pg $pg --output $zip
            if ($LASTEXITCODE -ne 0) { throw "PG$pg source byte audit or package failed" }
            $spdx = Join-Path $dir "pg_permissions-source-pg$pg.spdx.json"
            python scripts/issue112_pg_permissions_private_sbom.py --source pinned-pg-permissions --pg $pg --zip $zip --output $spdx
            if ($LASTEXITCODE -ne 0) { throw "PG$pg exact private SPDX failed" }
            $hashes += (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          }
          if (@($hashes | Select-Object -Unique).Count -ne 5) { throw 'PG-specific receipts collided' }
          Remove-Item -LiteralPath $dir -Recurse -Force
          Write-Output 'PG_PERMISSIONS_SOURCE_OWNED_PG14_18=PRIVATE_ONLY_SOURCE_PINS_PASS PUBLISH=DENY PUBLIC_GET=DENY'

  source-owned-pg14-18-real-sql-windows:
    needs: original-source-private-windows-package
    if: github.event_name == 'pull_request' && github.repository == 'pgextwin/catalog'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: 14, edb: '14.24.0' }
          - { pg: 15, edb: '15.19.0' }
          - { pg: 16, edb: '16.15.5' }
          - { pg: 17, edb: '17.11.4' }
          - { pg: 18, edb: '18.6.5' }
    permissions:
      contents: read
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disable Git worktree CRLF conversion before pinned checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot disable CRLF conversion' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve LF' }
      - name: Checkout exact immutable SQL source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cybertec-postgresql/pg_permissions
          ref: 3360447e0668fed2b9db6a0ae1d086533781f9bd
          path: pinned-pg-permissions
          persist-credentials: false
      - name: Checkout known PostgreSQL installer implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 07449a2384ae4e2fc01820e263ed4bc45cd73abf
          path: build-tools
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install disposable EDB PostgreSQL for selected major
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
          EDB_VERSION: ${{ matrix.edb }}
        run: |
          ./build-tools/scripts/install-postgresql.ps1 -Major ([int]$env:PG_MAJOR) -ChocolateyPackage "postgresql$($env:PG_MAJOR)" -ChocolateyVersion $env:EDB_VERSION -TestPort 55449
      - name: Real CREATE EXTENSION and permissions SQL from exact private ZIP
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: ./scripts/issue112-pg-permissions-owned-source-windows.ps1 -Major ([int]$env:PG_MAJOR)
      - name: Keep candidate nonpublishing after every outcome
        if: always()
        shell: pwsh
        run: Write-Host 'PG_PERMISSIONS=CANDIDATE_ONLY CYBERTEC_ORIGINAL=NO ZIP_UPLOAD=NONE GET=DENY MIRROR=DENY RELEASE=DENY PUBLISHER=NONE'
