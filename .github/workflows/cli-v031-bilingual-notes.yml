name: CLI v0.3.1 bilingual Release notes (metadata-only)

on:
  pull_request:
    paths:
      - 'docs/cli-v0.3.1-release-notes.md'
      - '.github/workflows/cli-v031-bilingual-notes.yml'
  workflow_run:
    workflows: ['Validate catalog']
    types: [completed]

permissions:
  contents: read

jobs:
  notes-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check EN then JA, signed source, release SHA and denial boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/cli-v0.3.1-release-notes.md').read_text(encoding='utf-8')
          required=['## English','## 日本語','83.83%','12,827,362',
             'baee38b3aafdd1bbb7f61857747358dbd40ab056d989aa0f753c93b2025a7580',
             'a7a1d93d38d7338d80404c402eb5faaaa96b272e',
             '39254657650','INTEGRITY_ONLY','--fixed','download-all --pg all',
             'https://pgextwin.github.io/website/en/cli.html',
             'https://pgextwin.github.io/website/ja/cli.html']
          assert all(s in p for s in required), 'Release notes missing original evidence or boundary'
          assert p.startswith('# pgextwin CLI v0.3.1') and 0<p.index('## English')<p.index('## 日本語'), 'Bad language order'
          assert p.count('## 日本語')==1 and p.count('## English')==1
          assert not any(x in p for x in ['signatureVerified=true', 'installAuthorized=true'])
          print('CLI_V031_NOTES_EN_JA_METADATA_ONLY=PASS')
          PY

  update-release-notes:
    if: ${{ github.repository == 'pgextwin/catalog' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Require exact current protected main and valid signed merge
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$(gh api repos/pgextwin/catalog/branches/main)"
          [[ "$(jq -r .protected <<< "$branch")" == true ]]
          [[ "$(jq -r .commit.sha <<< "$branch")" == "$SOURCE" ]] || { echo 'Catalog main advanced; reject stale note publish'; exit 1; }
          run="$(gh api "repos/pgextwin/catalog/actions/runs/$RUN_ID")"
          jq -e --arg sha "$SOURCE" '.status=="completed" and .conclusion=="success" and .event=="push" and .head_branch=="main" and .run_attempt==1 and .head_sha==$sha' <<< "$run"
          signed="$(gh api "repos/pgextwin/catalog/commits/$SOURCE")"
          jq -e '.commit.verification.verified==true and .commit.verification.reason=="valid" and .committer.login=="web-flow"' <<< "$signed"
          echo 'BILINGUAL_NOTES_CURRENT_SIGNED_MAIN_GATE=PASS'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate only exact existing CLI v0.3.1 Release and body-only change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pgextwin/catalog/releases/tags/cli-v0.3.1 > "$RUNNER_TEMP/release-before.json"
          gh api repos/pgextwin/catalog/git/ref/tags/cli-v0.3.1 > "$RUNNER_TEMP/tag.json"
          python - <<'PY'
          import json,os,pathlib
          rel=json.load(open(os.environ['RUNNER_TEMP']+'/release-before.json'))
          tag=json.load(open(os.environ['RUNNER_TEMP']+'/tag.json'))
          notes=pathlib.Path('docs/cli-v0.3.1-release-notes.md').read_text('utf-8')
          assert rel['id']==417278597 and rel['tag_name']=='cli-v0.3.1'
          assert rel['draft'] is False and rel['prerelease'] is True
          assert tag['object']['type']=='commit'
          assert tag['object']['sha']=='a7a1d93d38d7338d80404c402eb5faaaa96b272e'
          assert len(rel['assets'])==5
          names={a['name'] for a in rel['assets']}
          assert names=={'pgextwin.exe','pgextwin.spdx.json','SHA256SUMS.txt',
                         'DOTNET-LICENSE.txt','DOTNET-THIRD-PARTY-NOTICES.txt'}
          exe=next(a for a in rel['assets'] if a['name']=='pgextwin.exe')
          assert exe['size']==12827362
          assert exe['digest']=='sha256:baee38b3aafdd1bbb7f61857747358dbd40ab056d989aa0f753c93b2025a7580'
          assert notes.startswith('# pgextwin CLI v0.3.1')
          assert 0<notes.index('## English')<notes.index('## 日本語')
          assert 'INTEGRITY_ONLY' in notes and '39254657650' in notes
          body=rel['body']
          if body.replace('\r\n','\n').strip() != notes.strip():
              assert body.startswith('# pgextwin CLI v0.3.1 — Windows x64 EXE lightweight release')
              assert '## 日本語' not in body, 'Release body has changed since audit: deny overwrite'
          print('CLI_V031_METADATA_PUBLISH_ALLOWED=PASS')
          PY
      - name: Update only the existing Release body without touching binaries or tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(cat docs/cli-v0.3.1-release-notes.md)"
          gh api --method PATCH repos/pgextwin/catalog/releases/417278597 -f "body=$notes" > "$RUNNER_TEMP/release-after.json"
          python - <<'PY'
          import json,os,pathlib
          a=json.load(open(os.environ['RUNNER_TEMP']+'/release-before.json'))
          b=json.load(open(os.environ['RUNNER_TEMP']+'/release-after.json'))
          n=pathlib.Path('docs/cli-v0.3.1-release-notes.md').read_text('utf-8')
          assert b['body'].replace('\r\n','\n').strip()==n.strip(), 'Live GitHub Release text differs'
          assert (a['id'],a['tag_name'],a['draft'],a['prerelease'])==(
                  b['id'],b['tag_name'],b['draft'],b['prerelease'])
          assert [(x['id'],x['name'],x['size'],x['digest']) for x in a['assets']]==[
                 (x['id'],x['name'],x['size'],x['digest']) for x in b['assets']]
          print('CLI_V031_RELEASE_EN_THEN_JA_PUBLISHED=PASS ASSETS_UNCHANGED=5')
          PY
