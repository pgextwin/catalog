name: Issue112 TimescaleDB original PE dependency audit (deny-only)

on:
  pull_request:
    paths:
      - scripts/issue112_timescaledb_pe_imports.py
      - tests/test_issue112_timescaledb_pe_imports.py
      - .github/workflows/issue112-timescaledb-pe-imports.yml
      - docs/issue-112-timescaledb-pe-imports.md
  push:
    branches: [main]
    paths:
      - scripts/issue112_timescaledb_pe_imports.py
      - tests/test_issue112_timescaledb_pe_imports.py
      - .github/workflows/issue112-timescaledb-pe-imports.yml
      - docs/issue-112-timescaledb-pe-imports.md

permissions:
  contents: read

jobs:
  timescaledb-static-imports:
    name: TimescaleDB 2.31.0 PG${{ matrix.pg }} PE imports (deny-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17', '18']
    steps:
      - name: Read-only checkout with no persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline hostile import-graph and ZIP guard tests
        run: python3 -m unittest discover -s tests -p test_issue112_timescaledb_pe_imports.py -v
      - name: Inspect exact original provider DLL import tables
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: python3 scripts/issue112_timescaledb_pe_imports.py --pg "$PG_MAJOR"
      - name: Preserve every separate rights, producer and publishing gate
        if: always()
        run: echo 'IMPORT_OBSERVATION_ONLY=YES PUBLIC_GET=DENY MIRROR=DENY RELEASE=DENY PUBLISH=DENY'
