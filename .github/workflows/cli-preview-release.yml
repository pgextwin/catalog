name: Publish separately authorized CLI v0.1 preview (only after signed R6)
on:
  pull_request:
    paths:
      - '.github/workflows/cli-preview-release.yml'
      - 'config/cli-preview-release-intent.json'
      - 'scripts/cli_r7_asset_set.ps1'
  push:
    branches: [main]
    paths:
      - 'config/cli-preview-release-intent.json'

permissions:
  contents: read

jobs:
  verify:
    name: Verify fixed successful signed Windows binary for one CLI preview
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-r6-private-candidate
          run-id: 39200819667
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cli-release

      - name: Verify exact approved Release intent, successful original R6 run and real signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $intent = $null
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $intent = Get-Content config/cli-preview-release-intent.json -Raw | ConvertFrom-Json }
          $expectedSource = 'd0056b688dc27095d2d7ffd6f8b77aff965def79'
          $expectedDigest = 'c2782f46539bd932c9c19105055e45dcf8796d573a8c30ad9844e6ba510ddfb1'
          $expectedTag = 'cli-v0.1.0-preview.1'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and ($intent.schemaVersion -cne 'pgextwin-cli-preview-release/v1' -or
              $intent.publish -ne $true -or $intent.scope -cne 'CLI_ONLY_READONLY_PREVIEW' -or
              $intent.tag -cne $expectedTag -or
              $intent.sourceCommit -cne $expectedSource -or
              $intent.sourceRunId -ne 39200819667 -or
              $intent.exeSha256 -cne $expectedDigest)) { throw 'Release authorization manifest not approved' }
          $old = gh api repos/pgextwin/catalog/actions/runs/39200819667 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $old.status -ne 'completed' -or
              $old.conclusion -ne 'success' -or $old.event -ne 'push' -or
              $old.run_attempt -ne 1 -or $old.head_sha -cne $expectedSource) { throw 'Original protected-main signed R6 run not accepted' }
          $dir = Join-Path $env:RUNNER_TEMP 'cli-release'
          $files = @(Get-ChildItem $dir -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($files -join ',') -cne 'candidate-evidence.json,pgextwin.exe') { throw 'Wrong original run artifact files' }
          $exe = Join-Path $dir 'pgextwin.exe'
          $receipt = Get-Content (Join-Path $dir 'candidate-evidence.json') -Raw | ConvertFrom-Json
          $digest = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $expectedDigest -or
              $receipt.sha256 -cne $expectedDigest -or
              $receipt.sourceCommit -cne $expectedSource -or
              $receipt.runId -cne '39200819667' -or
              $receipt.publishAuthorized -ne $false -or
              $receipt.signatureVerified -ne $false) { throw 'Original EXE or source receipt mismatch' }
          $verified = gh attestation verify $exe --repo pgextwin/catalog --signer-workflow pgextwin/catalog/.github/workflows/cli-candidate.yml --source-ref refs/heads/main --source-digest $expectedSource --format json
          if ($LASTEXITCODE -ne 0 -or @(($verified | ConvertFrom-Json)).Count -lt 1) { throw 'Original signed provenance authentication failed' }
          Write-Output "CLI_R7_GENUINE_ORIGINAL_SLSA_VERIFIED=PASS SHA256=$digest RELEASE_NOT_YET_CREATED"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.402'

      - name: Collect exact .NET 10.0.13 runtime-pack license and third-party notices
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v=(& dotnet --version).Trim()
          if ($v -cne '10.0.402') { throw 'Runtime license material obtained with wrong SDK' }
          dotnet restore dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj --runtime win-x64 -p:RuntimeFrameworkVersion=10.0.13 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime pack restore failed' }
          $source = Join-Path $env:USERPROFILE '.nuget/packages/microsoft.netcore.app.runtime.win-x64/10.0.13'
          if (!(Test-Path $source -PathType Container)) { throw 'Pinned Windows runtime pack missing' }
          $license = @(Get-ChildItem $source -Recurse -File | Where-Object { $_.Name -ieq 'LICENSE.TXT' })
          $third = @(Get-ChildItem $source -Recurse -File | Where-Object { $_.Name -ieq 'THIRD-PARTY-NOTICES.TXT' })
          if ($license.Count -ne 1 -or $third.Count -ne 1 -or
              $license[0].Length -lt 400 -or $third[0].Length -lt 1000) { throw 'Microsoft runtime license or notices unavailable' }
          Copy-Item $license[0].FullName (Join-Path $env:RUNNER_TEMP 'cli-release/DOTNET-LICENSE.txt')
          Copy-Item $third[0].FullName (Join-Path $env:RUNNER_TEMP 'cli-release/DOTNET-THIRD-PARTY-NOTICES.txt')
          Write-Output 'CLI_R7_MICROSOFT_RUNTIME_NOTICES=PASS'

      - name: Generate pinned Syft SPDX 2.3 for candidate binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version='1.54.1'
          $expected='8b56e8285e295e0bbed26eeea9b16ed51c493be97ccdf42dae6326c84fe8e19f'
          $zip=Join-Path $env:RUNNER_TEMP 'syft-original.zip'
          Invoke-WebRequest "https://github.com/anchore/syft/releases/download/v$version/syft_${version}_windows_amd64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Syft original archive checksum mismatch' }
          $tools=Join-Path $env:RUNNER_TEMP 'syft-pinned'
          Expand-Archive $zip -DestinationPath $tools
          $exe=Join-Path $env:RUNNER_TEMP 'cli-release/pgextwin.exe'
          $sbom=Join-Path $env:RUNNER_TEMP 'cli-release/pgextwin.spdx.json'
          & (Join-Path $tools 'syft.exe') scan "file:$exe" -o "spdx-json@2.3=$sbom"
          if ($LASTEXITCODE -ne 0) { throw 'Syft SBOM generation failed' }
          $doc=Get-Content $sbom -Raw | ConvertFrom-Json
          if ($doc.spdxVersion -cne 'SPDX-2.3' -or !$doc.documentNamespace -or !$doc.SPDXID) { throw 'Malformed SPDX output' }
          $files = @('pgextwin.exe','pgextwin.spdx.json','DOTNET-LICENSE.txt','DOTNET-THIRD-PARTY-NOTICES.txt')
          $lines = @($files | ForEach-Object { "$(Get-FileHash (Join-Path $env:RUNNER_TEMP "cli-release/$_") -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $_" })
          $lines | Set-Content (Join-Path $env:RUNNER_TEMP 'cli-release/SHA256SUMS.txt') -Encoding ascii
          Write-Output 'CLI_R7_SPDX_CHECKSUMS=PASS'

      - name: Reproduce exact five-file asset validation before release upload
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cli-release'
          & ./scripts/cli_r7_asset_set.ps1 -Directory $dir
          if ($LASTEXITCODE -ne 0) { throw 'Release file validation failed' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-v01-verified-release-input
          path: |
            ${{ runner.temp }}/cli-release/pgextwin.exe
            ${{ runner.temp }}/cli-release/pgextwin.spdx.json
            ${{ runner.temp }}/cli-release/SHA256SUMS.txt
            ${{ runner.temp }}/cli-release/DOTNET-LICENSE.txt
            ${{ runner.temp }}/cli-release/DOTNET-THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Only a protected main push modifying the owner-approved exact release-intent
    # can reach this job. PRs have no publishing job or write token.
    needs: verify
    name: Create-only CLI draft, rehash, then publish prerelease
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-v01-verified-release-input
          path: ${{ runner.temp }}/cli-release
      - name: Atomically reserve exact CLI tag, draft with assets and verify before public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $expectedSource='d0056b688dc27095d2d7ffd6f8b77aff965def79'
          $digest='c2782f46539bd932c9c19105055e45dcf8796d573a8c30ad9844e6ba510ddfb1'
          $tag='cli-v0.1.0-preview.1'
          $intent=Get-Content config/cli-preview-release-intent.json -Raw | ConvertFrom-Json
          if ($intent.publish -ne $true -or $intent.tag -cne $tag -or $intent.exeSha256 -cne $digest -or $intent.sourceCommit -cne $expectedSource) { throw 'Release intent changed' }
          $dir=Join-Path $env:RUNNER_TEMP 'cli-release'
          & ./scripts/cli_r7_asset_set.ps1 -Directory $dir
          if ($LASTEXITCODE -ne 0) { throw 'Release original asset validation failed' }
          if ((Get-FileHash (Join-Path $dir 'pgextwin.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) { throw 'EXE hash mismatch' }
          $reserve=gh api --method POST repos/pgextwin/catalog/git/refs -f "ref=refs/tags/$tag" -f "sha=$expectedSource"
          if ($LASTEXITCODE -ne 0) { throw 'CLI tag already exists or cannot be created: fail closed' }
          gh release create $tag (Join-Path $dir 'pgextwin.exe') (Join-Path $dir 'SHA256SUMS.txt') (Join-Path $dir 'pgextwin.spdx.json') (Join-Path $dir 'DOTNET-LICENSE.txt') (Join-Path $dir 'DOTNET-THIRD-PARTY-NOTICES.txt') --verify-tag --draft --prerelease --latest=false --title 'pgextwin CLI v0.1.0-preview.1' --notes-file docs/cli-v0.1-release-notes.md --repo pgextwin/catalog
          if ($LASTEXITCODE -ne 0) { throw 'Draft Release failed; do not publish' }
          $d=Join-Path $env:RUNNER_TEMP 'audit-original-public-draft'
          New-Item -ItemType Directory $d -Force | Out-Null
          gh release download $tag --repo pgextwin/catalog --pattern pgextwin.exe --dir $d
          if ($LASTEXITCODE -ne 0) { throw 'Draft EXE download audit failed' }
          if ((Get-FileHash (Join-Path $d 'pgextwin.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) { throw 'Draft EXE original bytes differ' }
          gh release edit $tag --repo pgextwin/catalog --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          Write-Output "CLI_R7_PUBLIC_RELEASE=PASS URL=https://github.com/pgextwin/catalog/releases/tag/$tag"
