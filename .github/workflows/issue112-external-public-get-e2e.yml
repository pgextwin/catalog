name: Issue112 real Windows original-provider GET-only E2E (no publication)

# Only original successful protected Catalog/main Validate following a signed
# metadata PR or a change to this E2E workflow may start this nonpublishing test.
# Every GET still requires one active, independently verified signed admission.
# Never runs on PR, synthetic push, dispatch, schedule or an arbitrary artifact.
on:
  workflow_run:
    workflows: ["Validate catalog"]
    types: [completed]

permissions:
  contents: read

jobs:
  authenticate-original-main:
    if: >-
      github.repository == 'pgextwin/catalog' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      source: ${{ steps.gate.outputs.source }}
      provider: ${{ steps.gate.outputs.provider }}
    steps:
      - name: Authenticate real exact-head protected main Validate and new signed files
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$CATALOG_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          branch="$(gh api repos/pgextwin/catalog/branches/main)"
          [[ "$(jq -r '.protected' <<< "$branch")" == true ]]
          [[ "$(jq -r '.commit.sha' <<< "$branch")" == "$CATALOG_SHA" ]] || { echo 'Stale main; no GET'; exit 1; }
          run="$(gh api "repos/pgextwin/catalog/actions/runs/$VALIDATE_RUN")"
          jq -e --arg sha "$CATALOG_SHA" '
            .status=="completed" and .conclusion=="success" and
            .event=="push" and .head_branch=="main" and .head_sha==$sha and
            .run_attempt==1 and .path==".github/workflows/validate.yml" and
            .repository.full_name=="pgextwin/catalog"
          ' <<< "$run" >/dev/null
          jobs="$(gh api "repos/pgextwin/catalog/actions/runs/$VALIDATE_RUN/jobs?per_page=100")"
          jq -e 'any(.jobs[]; .name=="validate" and .conclusion=="success")' <<< "$jobs" >/dev/null
          commit="$(gh api "repos/pgextwin/catalog/commits/$CATALOG_SHA")"
          jq -e '
            .commit.verification.verified==true and .commit.verification.reason=="valid" and
            .committer.login=="web-flow" and
            .commit.committer.email=="noreply@github.com"
          ' <<< "$commit" >/dev/null
          if ! jq -e '
            ([.files[]? | select(
              (.status=="added") and
              (.filename | test("^external/signed-direct-get/(pg_trickle|hypopg|portalcorp_pgvector|qualified_cohort)/run-[0-9]+/(external-get-admission|attestation)\\.json$"))
            )] | length==2)
            or
            (([.files[]? | select(
              .status=="modified" and .filename==".github/workflows/issue112-external-public-get-e2e.yml"
            )] | length==1)
             and ([.files[]? | select(
               .filename | startswith("external/signed-direct-get/")
             )] | length==0))
          ' <<< "$commit" >/dev/null; then
            echo 'NO_NEW_SIGNED_PIN_OR_E2E_WORKFLOW_CHANGE; no provider GET'
            exit 0
          fi
          cohort="$(jq -r '.files[]? | select(.status=="added") | .filename |
            select(test("^external/signed-direct-get/(pg_trickle|hypopg|portalcorp_pgvector|qualified_cohort)/run-[0-9]+/(external-get-admission|attestation)\\.json$"))' <<< "$commit" |
            sed -E 's#^external/signed-direct-get/([^/]+)/(run-[0-9]+)/.*#\1/\2#' | sort -u)"
          if [ -z "$cohort" ]; then
            # An actual protected workflow change may verify the latest already
            # published cohort. The Windows job still requires live Sigstore.
            cohort="qualified_cohort/workflow-verified"
          fi
          if [ "$(printf '%s\n' "$cohort" | wc -l)" -ne 1 ]; then
            echo 'Mixed signed cohorts in one commit; DENY'
            exit 1
          fi
          provider="${cohort%%/*}"
          case "$provider" in pg_trickle|hypopg|portalcorp_pgvector|qualified_cohort) ;; *) exit 1 ;; esac
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "source=$CATALOG_SHA" >> "$GITHUB_OUTPUT"
          echo "AUTHENTIC_SIGNED_CATALOG_MAIN_POSTMERGE_VALIDATE=PASS SHA=$CATALOG_SHA"

  windows-real-original-get:
    needs: authenticate-original-main
    if: needs.authenticate-original-main.outputs.source != ''
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact protected Catalog postmerge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-original-main.outputs.source }}
          persist-credentials: false
      - name: Independently verify public signed metadata, issuer and owner review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          python scripts/validate_public_get_pin.py --catalog .
          if ($LASTEXITCODE -ne 0) { throw 'Public signed original GET-only admission verification failed' }
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.402'
      - name: Compile unpublished Windows x64 CLI E2E candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'issue112-private-cli'
          dotnet publish dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=10.0.13 -p:PublishTrimmed=true -p:TrimMode=full -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false --output $folder --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $folder 'pgextwin.exe'))) { throw 'Private Windows CLI build missing' }
      - name: Independently authenticate the published versioned Windows CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $policy=Get-Content config/cli-external-get-formal-publisher-v1.json -Raw | ConvertFrom-Json
          if ($policy.publishAuthorized -ne $true) {
            Write-Output 'PUBLIC_CLI_ORIGINAL_GET=SKIPPED_NO_FORMAL_CLI_RELEASE'
            exit 0
          }
          $project=[xml](Get-Content dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj -Raw)
          $version=[string]$project.Project.PropertyGroup.Version
          if ($version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or
              $policy.approvedVersion -cne $version) { throw 'CLI release policy version mismatch' }
          $tag="cli-v$version"
          $releaseError=Join-Path $env:RUNNER_TEMP 'cli-release-lookup.stderr'
          $releaseJson=gh api "repos/pgextwin/catalog/releases/tags/$tag" 2> $releaseError
          if ($LASTEXITCODE -ne 0) {
            if ((Get-Content $releaseError -Raw) -match 'HTTP 404') {
              Write-Output 'PUBLIC_CLI_ORIGINAL_GET=SKIPPED_PENDING_FORMAL_OWNER_RELEASE'
              exit 0
            }
            throw 'CLI Release lookup failed'
          }
          $release=$releaseJson | ConvertFrom-Json
          if ($release.draft -ne $false -or $release.tag_name -cne $tag) {
            throw 'Authorized public CLI Release not found'
          }
          $source=[string]$release.target_commitish
          if ($source -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid public CLI source commit' }
          $ref=gh api "repos/pgextwin/catalog/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $ref.object.type -cne 'commit' -or $ref.object.sha -cne $source) {
            throw 'Public CLI tag does not match its source'
          }
          $comparison=gh api "repos/pgextwin/catalog/compare/$source...$env:GITHUB_SHA" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $comparison.status -cnotin @('ahead','identical')) {
            throw 'Public CLI source is not on protected main ancestry'
          }
          $assets=@($release.assets | Where-Object { $_.name -ceq 'pgextwin.exe' -and $_.state -ceq 'uploaded' })
          if ($assets.Count -ne 1 -or $assets[0].digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Missing unique public CLI digest'
          }
          $expected=([string]$assets[0].digest).Substring(7)
          $dir=Join-Path $env:RUNNER_TEMP 'issue112-public-cli'
          New-Item -ItemType Directory -Path $dir | Out-Null
          gh release download $tag --repo pgextwin/catalog --pattern pgextwin.exe --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Public CLI download failed' }
          $exe=Join-Path $dir 'pgextwin.exe'
          $actual=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected -or (& $exe --version).Trim() -cne $version -or $LASTEXITCODE -ne 0) {
            throw 'Public CLI original bytes or version mismatch'
          }
          $proof=gh attestation verify $exe --repo pgextwin/catalog --signer-workflow pgextwin/catalog/.github/workflows/cli-candidate.yml --source-ref refs/heads/main --source-digest $source --deny-self-hosted-runners --format json
          if ($LASTEXITCODE -ne 0 -or @(($proof | ConvertFrom-Json)).Count -lt 1) {
            throw 'Public CLI independent Sigstore provenance verification failed'
          }
          Write-Output "PUBLIC_CLI_BYTES_AND_SIGSTORE=PASS VERSION=$version SHA256=$actual SOURCE=$source"
      - name: Run exact provider original source bytes GET and atomic CLI E2E
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_PROVIDER: ${{ needs.authenticate-original-main.outputs.provider }}
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/issue112-public-original-get-e2e.ps1 -Source $env:PIN_PROVIDER
