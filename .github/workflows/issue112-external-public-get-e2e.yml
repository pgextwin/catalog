name: Issue112 real Windows original-provider GET-only E2E (no publication)

# Only original successful protected Catalog/main Validate following an immutable,
# signed metadata PR merge may start the user-local original provider GET test.
# Never runs on PR, synthetic push, dispatch, schedule or an arbitrary artifact.
on:
  workflow_run:
    workflows: ["Validate catalog"]
    types: [completed]

permissions:
  contents: read

jobs:
  authenticate-original-main:
    if: >-
      github.repository == 'pgextwin/catalog' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      source: ${{ steps.gate.outputs.source }}
    steps:
      - name: Authenticate real exact-head protected main Validate and new signed files
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$CATALOG_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          branch="$(gh api repos/pgextwin/catalog/branches/main)"
          [[ "$(jq -r '.protected' <<< "$branch")" == true ]]
          [[ "$(jq -r '.commit.sha' <<< "$branch")" == "$CATALOG_SHA" ]] || { echo 'Stale main; no GET'; exit 1; }
          run="$(gh api "repos/pgextwin/catalog/actions/runs/$VALIDATE_RUN")"
          jq -e --arg sha "$CATALOG_SHA" '
            .status=="completed" and .conclusion=="success" and
            .event=="push" and .head_branch=="main" and .head_sha==$sha and
            .run_attempt==1 and .path==".github/workflows/validate.yml" and
            .repository.full_name=="pgextwin/catalog"
          ' <<< "$run" >/dev/null
          jobs="$(gh api "repos/pgextwin/catalog/actions/runs/$VALIDATE_RUN/jobs?per_page=100")"
          jq -e 'any(.jobs[]; .name=="validate" and .conclusion=="success")' <<< "$jobs" >/dev/null
          commit="$(gh api "repos/pgextwin/catalog/commits/$CATALOG_SHA")"
          jq -e '
            .commit.verification.verified==true and .commit.verification.reason=="valid" and
            .committer.login=="web-flow" and
            .commit.committer.email=="noreply@github.com"
          ' <<< "$commit" >/dev/null
          if ! jq -e '
            [.files[]? | select(
              (.status=="added") and
              (.filename | test("^external/signed-direct-get/pg_trickle/run-[0-9]+/(external-get-admission|attestation)\\.json$"))
            )] | length==2
          ' <<< "$commit" >/dev/null; then
            echo 'NO_NEW_SIGNED_GET_ONLY_PIN; no provider GET'
            exit 0
          fi
          echo "source=$CATALOG_SHA" >> "$GITHUB_OUTPUT"
          echo "AUTHENTIC_SIGNED_CATALOG_MAIN_POSTMERGE_VALIDATE=PASS SHA=$CATALOG_SHA"

  windows-real-original-get:
    needs: authenticate-original-main
    if: needs.authenticate-original-main.outputs.source != ''
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact protected Catalog postmerge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-original-main.outputs.source }}
          persist-credentials: false
      - name: Independently verify public signed metadata, issuer and owner review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          python scripts/validate_public_get_pin.py --catalog .
          if ($LASTEXITCODE -ne 0) { throw 'Public signed original GET-only admission verification failed' }
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.402'
      - name: Compile unpublished Windows x64 CLI E2E candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'issue112-private-cli'
          dotnet publish dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=10.0.13 -p:PublishTrimmed=true -p:TrimMode=full -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false --output $folder --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $folder 'pgextwin.exe'))) { throw 'Private Windows CLI build missing' }
      - name: Run actual provider-original bytes GET, SHA256 and atomic disk E2E
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'external/signed-direct-get/pg_trickle'
          $now=[DateTimeOffset]::UtcNow
          $active=@(Get-ChildItem -LiteralPath $root -Directory | Where-Object {
            $doc=Get-Content -LiteralPath (Join-Path $_.FullName 'external-get-admission.json') -Raw | ConvertFrom-Json
            ([DateTimeOffset]::Parse($doc.issuedAt) -le $now) -and
            ($now -lt [DateTimeOffset]::Parse($doc.expiresAt))
          })
          if ($active.Count -ne 1) { throw "Exactly one authentic unexpired GET-only pin required; got $($active.Count)" }
          $admission=Join-Path $active[0].FullName 'external-get-admission.json'
          $bundle=Join-Path $active[0].FullName 'attestation.json'
          $dest=Join-Path $env:RUNNER_TEMP 'issue112-user-local-originals'
          New-Item -ItemType Directory -Path $dest | Out-Null
          $exe=Join-Path $env:RUNNER_TEMP 'issue112-private-cli/pgextwin.exe'
          & $exe download-all --source external --pg 18 --output $dest --external-admission $admission --external-bundle $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Actual user-local original provider GET failed' }
          $originals=@(Get-ChildItem -LiteralPath $dest -Recurse -File -Filter '*.zip')
          if ($originals.Count -ne 1) { throw "Expected exactly one verified provider-original ZIP; got $($originals.Count)" }
          $original=$originals[0]
          $digest=(Get-FileHash -LiteralPath $original.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($original.Length -ne 7029107 -or $digest -cne 'c2841dacee6fa1a09400c7e9a0f74159f2b7f36847a60ef10291d1beb06bd96b') {
            throw 'Original provider bytes / SHA256 drift'
          }
          Write-Output "REAL_WINDOWS_ORIGINAL_GET_ONLY_E2E=PASS BYTES=$($original.Length) SHA256=$digest PUBLISH=DENY MIRROR=DENY"
          Remove-Item -LiteralPath $dest -Recurse -Force
          if (Test-Path -LiteralPath $dest) { throw 'Original-byte cleanup failed' }
