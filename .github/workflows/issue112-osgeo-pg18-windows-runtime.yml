name: Issue112 OSGeo latest PostGIS pgRouting PG18 Windows SQL (nonpublishing)

on:
  pull_request:
    paths:
      - scripts/issue112-osgeo-pg18-windows-runtime.ps1
      - scripts/issue112_osgeo_pg18_live_roots.py
      - scripts/issue112_osgeo_pg18_loaded_bundle.py
      - tests/test_issue112_osgeo_pg18_loaded_bundle.py
      - tests/test_issue112_osgeo_pg18_live_roots.py
      - docs/issue-112-osgeo-pg18-live-roots.md
      - .github/workflows/issue112-osgeo-pg18-windows-runtime.yml
  push:
    branches: [main]
    paths:
      - scripts/issue112-osgeo-pg18-windows-runtime.ps1
      - scripts/issue112_osgeo_pg18_live_roots.py
      - scripts/issue112_osgeo_pg18_loaded_bundle.py
      - tests/test_issue112_osgeo_pg18_loaded_bundle.py
      - tests/test_issue112_osgeo_pg18_live_roots.py
      - docs/issue-112-osgeo-pg18-live-roots.md
      - .github/workflows/issue112-osgeo-pg18-windows-runtime.yml

permissions:
  contents: read

jobs:
  original-bundle-pg18-native-sql:
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate with credentials disabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline hostile exact-origin and rights-denial tests
        shell: pwsh
        run: python -m unittest discover -s tests -p test_issue112_osgeo_pg18_live_roots.py -v
      - name: Offline hostile sampled bundle module origin checks
        shell: pwsh
        run: python -m unittest discover -s tests -p test_issue112_osgeo_pg18_loaded_bundle.py -v
      - name: Parse PowerShell runtime script before expensive PG installation
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile([string](Resolve-Path './scripts/issue112-osgeo-pg18-windows-runtime.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ('PowerShell syntax invalid: ' + ($parseErrors | Out-String)) }
      - name: Reuse immutable shared PostgreSQL installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 07449a2384ae4e2fc01820e263ed4bc45cd73abf
          path: build-tools
          persist-credentials: false
      - name: Install disposable EDB PG18 with existing bounded fallback
        shell: pwsh
        run: ./build-tools/scripts/install-postgresql.ps1 -Major 18 -ChocolateyPackage postgresql18 -ChocolateyVersion 18.6.5 -TestPort 55449
      - name: Independently rehash OSGeo original, execute SQL and verify both live server DLL origins
        shell: pwsh
        run: ./scripts/issue112-osgeo-pg18-windows-runtime.ps1
      - name: Keep private candidate isolated from public download and Publisher
        if: always()
        shell: pwsh
        run: Write-Host 'CANDIDATE_ONLY=YES NO_ARTIFACT_UPLOAD=YES NO_RELEASE=YES NO_MIRROR=YES PUBLIC_GET=DENY'
