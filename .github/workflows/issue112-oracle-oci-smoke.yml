name: Issue112 oracle_fdw minimal OCI PG18 smoke (nonpublishing)

on:
  pull_request:
    paths:
      - scripts/issue112-oracle-oci-smoke.ps1
      - .github/workflows/issue112-oracle-oci-smoke.yml
  push:
    branches:
      - main
    paths:
      - scripts/issue112-oracle-oci-smoke.ps1
      - .github/workflows/issue112-oracle-oci-smoke.yml

permissions:
  contents: read

jobs:
  pg18-oci-load-only:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout immutable test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reuse approved PostgreSQL installer at immutable build commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 500131e3ec5ea9bd1a10e9c703626c76e38b13f6
          path: build-tools
          persist-credentials: false

      - name: Install pinned EDB PostgreSQL 18
        shell: pwsh
        run: |
          ./build-tools/scripts/install-postgresql.ps1 -Major 18 -ChocolateyPackage postgresql18 -ChocolateyVersion 18.6.5 -TestPort 55445

      - name: Only load oracle_fdw with Oracle's own Instant Client
        shell: pwsh
        run: |
          ./scripts/issue112-oracle-oci-smoke.ps1

      - name: Assert publication forbidden
        if: always()
        shell: pwsh
        run: |
          Write-Host 'ORACLE_DB_CONNECTION=NOT_TESTED NO_UPLOAD=YES NO_MIRROR=YES PUBLICATION=DENY'
