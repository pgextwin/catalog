name: CLI R6 private candidate (no publication)
on:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'scripts/cli_r6_candidate.py'
      - 'tests/test_cli_r6_candidate.py'
      - '.github/workflows/cli-candidate.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - '.github/workflows/cli-candidate.yml'
      - 'scripts/cli_r6_candidate.py'
      - 'tests/test_cli_r6_candidate.py'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.402'
      - name: Build v0.3.2 trimmed private binary and SHA256
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cli-candidate'
          dotnet publish dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=10.0.13 -p:PublishTrimmed=true -p:TrimMode=full -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o $dir
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $exe = Join-Path $dir 'pgextwin.exe'
          if (!(Test-Path $exe)) { throw 'Binary missing' }
          if ((Get-Item $exe).Length -ge 16000000) { throw 'CLI v0.3.2 full-trim size target not met' }
          if ((& dotnet --version).Trim() -cne '10.0.402') { throw 'Wrong patched SDK' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "R6_CANDIDATE_SHA256=$sha RELEASE=DENY"
      - name: Record bounded exact-byte receipt (not a signature)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'cli-candidate/pgextwin.exe'
          $receipt = Join-Path $env:RUNNER_TEMP 'cli-candidate/candidate-evidence.json'
          $sha = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $sdk = (& dotnet --version).Trim()
          python scripts/cli_r6_candidate.py emit --binary $exe --receipt $receipt --source $sha --run-id $env:GITHUB_RUN_ID --sdk $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Receipt emission failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-r6-private-candidate
          path: |
            ${{ runner.temp }}/cli-candidate/pgextwin.exe
            ${{ runner.temp }}/cli-candidate/candidate-evidence.json
          if-no-files-found: error
          retention-days: 1

  independent-smoke:
    name: Independent Windows CLI runtime and hash verification
    needs: candidate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-r6-private-candidate
          path: ${{ runner.temp }}/cli-independent
      - name: Rehash original bytes, reject escalation and run EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'cli-independent'
          $names = @(Get-ChildItem -LiteralPath $dir -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($names -join ',') -cne 'candidate-evidence.json,pgextwin.exe') { throw 'Unexpected candidate file layout' }
          $exe = Join-Path $dir 'pgextwin.exe'
          $receipt = Join-Path $dir 'candidate-evidence.json'
          $sha = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          python scripts/cli_r6_candidate.py verify --binary $exe --receipt $receipt --source $sha --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Independent candidate verification failed' }
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '0.3.2') { throw 'Version smoke failed' }
          $jsonText = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --pg 18 --format json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Catalog smoke failed' }
          $data = $jsonText | ConvertFrom-Json
          $index = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'index.json') -Raw | ConvertFrom-Json
          $expectedCount = @($index.extensions).Count
          if ($index.schemaVersion -ne 2 -or $expectedCount -lt 14 -or $expectedCount -gt 17) { throw 'Unsupported protected Catalog fleet size' }
          if ($data.count -ne $expectedCount -or @($data.records).Count -ne $expectedCount -or $data.trust -cne 'UNVERIFIED' -or $data.signatureVerified -ne $false) { throw 'Unsafe listing' }
          $search = & $exe search cron --catalog-dir $env:GITHUB_WORKSPACE --pg 18 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $search -notmatch 'pg_cron') { throw 'Search smoke failed' }
          $deny = & $exe verify pg_cron --pg 18 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $deny -notmatch 'DENY:') { throw 'Unimplemented Sigstore verification accepted' }
          $global:LASTEXITCODE = 0
          Write-Output 'CLI_R6_PRIVATE_FRESH_RUNNER_SMOKE=PASS PUBLISH=DENY'

  attest-provenance:
    # Signed provenance only for protected main, never an untrusted PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [candidate, independent-smoke]
    name: Sign exact Windows binary build provenance (main only)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact current-run candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-r6-private-candidate
          path: ${{ runner.temp }}/cli-signed

      - name: Validate only expected original candidate byte files
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cli-signed'
          $names = @(Get-ChildItem -LiteralPath $dir -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($names -join ',') -cne 'candidate-evidence.json,pgextwin.exe') { throw 'Unexpected candidate set' }
          $receipt = Get-Content -LiteralPath (Join-Path $dir 'candidate-evidence.json') -Raw | ConvertFrom-Json
          $sha = (Get-FileHash -LiteralPath (Join-Path $dir 'pgextwin.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.sourceCommit -cne $env:GITHUB_SHA.ToLowerInvariant() -or
              $receipt.runId -cne [string]$env:GITHUB_RUN_ID -or
              $receipt.sha256 -cne $sha -or
              $receipt.signatureVerified -ne $false -or
              $receipt.provenanceVerified -ne $false -or
              $receipt.publishAuthorized -ne $false) { throw 'Receipt identity mismatch' }
          Write-Output "CLI_PROVENANCE_INPUT_VERIFIED=$sha"

      - name: Issue Sigstore SLSA v1 attestation for actual binary (not release)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/cli-signed/pgextwin.exe

  verify-provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [attest-provenance]
    name: Independently verify signed CLI provenance and source identity
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download same-run candidate to distinct clean verifier
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-r6-private-candidate
          path: ${{ runner.temp }}/cli-verified

      - name: Independently validate SLSA, signer workflow, protected ref and SHA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'cli-verified/pgextwin.exe'
          $receipt = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'cli-verified/candidate-evidence.json') -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.sha256 -cne $digest -or
              $receipt.sourceCommit -cne $env:GITHUB_SHA.ToLowerInvariant() -or
              $receipt.runId -cne [string]$env:GITHUB_RUN_ID) { throw 'Byte/checkout/run identity mismatch' }
          $result = & gh attestation verify $exe --repo pgextwin/catalog --signer-workflow pgextwin/catalog/.github/workflows/cli-candidate.yml --source-ref refs/heads/main --source-digest $env:GITHUB_SHA --format json
          if ($LASTEXITCODE -ne 0) { throw 'Genuine SLSA signature validation failed' }
          $checked = $result | ConvertFrom-Json
          if (@($checked).Count -lt 1) { throw 'No verified attestations' }
          Write-Output "CLI_R6_GENUINE_SLSA_SIGNER_MAIN_VERIFIED=PASS SHA256=$digest PUBLISH=DENY"
