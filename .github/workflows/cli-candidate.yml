name: CLI R6 private candidate (no publication)
on:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'external/direct-get.json'
      - 'config/cli-external-get-formal-publisher-v1.json'
      - '.github/workflows/cli-release.yml'
      - 'scripts/cli_r6_candidate.py'
      - 'tests/test_cli_r6_candidate.py'
      # The exact required remote-byte gate changes with this validator.
      - 'scripts/validate_catalog.py'
      - 'tests/test_validate_catalog.py'
      - '.github/workflows/cli-candidate.yml'
  pull_request:
    paths:
      # Windows smoke also covers checkout byte fidelity and release scripts on PRs.
      - '.gitattributes'
      - 'global.json'
      - 'dotnet/**'
      - 'external/signed-direct-get/**'
      - '.github/workflows/cli-release.yml'
      - '.github/workflows/issue112-external-public-get-e2e.yml'
      - 'scripts/validate_public_get_pin.py'
      - 'tests/test_validate_public_get_pin.py'
      - 'external/direct-get.json'
      - 'config/cli-external-get-formal-publisher-v1.json'
      - '.github/workflows/cli-candidate.yml'
      - 'scripts/cli_r6_candidate.py'
      - 'tests/test_cli_r6_candidate.py'
      # The exact required remote-byte gate changes with this validator.
      - 'scripts/validate_catalog.py'
      - 'tests/test_validate_catalog.py'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.100'
      - name: Build versioned trimmed private binary and SHA256
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cli-candidate'
          dotnet publish dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=11.0.0 -p:PublishTrimmed=true -p:TrimMode=full -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o $dir
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $exe = Join-Path $dir 'pgextwin.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Binary missing' }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and (Get-ChildItem -LiteralPath $dir -File -Filter '*.dll')) { throw 'Unexpected loose DLLs in single-file output' }
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -le 0 -or $size -ge 16000000) { throw 'Invalid CLI binary size' }
          if ((& dotnet --version).Trim() -cne '11.0.100') { throw 'Wrong patched SDK' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "R6_CANDIDATE_SHA256=$sha SIZE=$size RELEASE=DENY"
      - name: Exercise signed feed v3 selection and trust contracts on Windows
        if: github.event_name == 'pull_request'
        run: dotnet run --project dotnet/tests/PgExtWin.Contract.Tests --configuration Release -- --signed-feed
      - name: Record bounded exact-byte receipt (not a signature)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'cli-candidate/pgextwin.exe'
          $receipt = Join-Path $env:RUNNER_TEMP 'cli-candidate/candidate-evidence.json'
          $sha = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $sdk = (& dotnet --version).Trim()
          python scripts/cli_r6_candidate.py emit --binary $exe --receipt $receipt --source $sha --run-id $env:GITHUB_RUN_ID --sdk $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Receipt emission failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-r6-private-candidate
          path: |
            ${{ runner.temp }}/cli-candidate/pgextwin.exe
            ${{ runner.temp }}/cli-candidate/candidate-evidence.json
          if-no-files-found: error
          retention-days: 1

  independent-smoke:
    name: Independent Windows CLI runtime and hash verification
    needs: candidate
    runs-on: windows-latest
    permissions:
      contents: read
    # The checks moved from validate.yml run on PRs. Main keeps the original candidate checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-r6-private-candidate
          path: ${{ runner.temp }}/cli-independent
      - name: Verify signed GET-only metadata bytes and signature on Windows
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files -- 'external/signed-direct-get/')
          if ($LASTEXITCODE -ne 0) { throw 'Signed metadata inventory failed' }
          foreach ($file in $files) {
            $expected = (& git rev-parse "HEAD:$file").Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Signed metadata Git blob unavailable' }
            $actual = (& git hash-object --no-filters -- $file).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) {
              throw 'Signed metadata working-tree bytes differ from Git blob'
            }
          }
          python scripts/validate_public_get_pin.py --catalog .
          if ($LASTEXITCODE -ne 0) { throw 'Windows signed metadata verification failed' }
          Write-Output "WINDOWS_SIGNED_METADATA_BYTE_FIDELITY=PASS FILES=$($files.Count) PROVIDER_GET=NONE"

      - name: Parse versioned CLI release PowerShell without executing publication
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          foreach ($workflow in @('.github/workflows/cli-release.yml','.github/workflows/issue112-external-public-get-e2e.yml')) {
            $text=Get-Content $workflow -Raw
            if ($workflow -like '*issue112-external-public-get-e2e.yml') {
              $offset=$text.IndexOf(([string][char]10 + '  windows-real-original-get:'))
              if ($offset -lt 0) { throw 'Windows E2E job missing' }
              $text=$text.Substring($offset)
            }
            $blocks=[regex]::Matches($text,'(?m)^        run: \|\r?\n(?<code>(?:^          .*\r?\n|^\r?\n)+)')
            if ($blocks.Count -eq 0) { throw "No PowerShell blocks found in $workflow" }
            foreach ($block in $blocks) {
              $code=$block.Groups['code'].Value -replace '(?m)^          ',''
              $tokens=$null; $errors=$null
              [void][System.Management.Automation.Language.Parser]::ParseInput($code,[ref]$tokens,[ref]$errors)
              if ($errors.Count) { throw ($errors | Out-String) }
            }
            Write-Output "CLI_RELEASE_POWERSHELL_PARSE=PASS WORKFLOW=$workflow BLOCKS=$($blocks.Count) NO_EXECUTION=true"
          }

      - name: Rehash original candidate bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'cli-independent'
          $names = @(Get-ChildItem -LiteralPath $dir -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($names -join ',') -cne 'candidate-evidence.json,pgextwin.exe') { throw 'Unexpected candidate file layout' }
          $exe = Join-Path $dir 'pgextwin.exe'
          $receipt = Join-Path $dir 'candidate-evidence.json'
          $sha = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          python scripts/cli_r6_candidate.py verify --binary $exe --receipt $receipt --source $sha --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Independent candidate verification failed' }
      - name: Smoke-check packaged CLI and negative trust path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'cli-independent/pgextwin.exe'
          $version = & $exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -cne ([string]([xml](Get-Content dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj -Raw)).Project.PropertyGroup.Version)) { throw 'CLI candidate version smoke failed' }
          $index = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'index.json') -Raw | ConvertFrom-Json
          $expectedCount = @($index.extensions).Count
          if ($index.schemaVersion -ne 2 -or $expectedCount -lt 1 -or $expectedCount -gt 128) { throw 'Unsupported protected Catalog fleet size' }
          $jsonText = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --pg 18 --format json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'JSON list CLI failed' }
          $json = $jsonText | ConvertFrom-Json
          if ($json.count -ne $expectedCount -or @($json.records).Count -ne $expectedCount -or $json.trust -cne 'UNVERIFIED' -or $json.signatureVerified -ne $false) { throw 'Unsafe listing' }
          $found = & $exe search cron --catalog-dir $env:GITHUB_WORKSPACE --pg 18 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $found -notmatch 'pg_cron') { throw 'Search smoke failed' }
          $unsupportedVerify = & $exe verify pg_cron --pg 18 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $unsupportedVerify -notmatch 'DENY:') { throw 'Unsupported Sigstore verify was accepted' }

          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $helpText = & $exe --help 2>&1 | Out-String
            if ($helpText -notmatch 'download-all') { throw 'Bulk download command absent' }
            if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'pgextwin list') { throw 'Help smoke failed' }
            $listing = @(& $exe list --catalog-dir $env:GITHUB_WORKSPACE --pg 18 2>&1)
            if ($LASTEXITCODE -ne 0) { throw 'List smoke failed' }
            if ($listing[0] -ne 'SOURCE=LOCAL_UNAUTHENTICATED TRUST=UNVERIFIED PUBLISH=DENY') { throw 'Trust banner missing' }
            $rows = @($listing | Where-Object { $_ -match '^\w+\tPG18\t' })
            if ($rows.Count -ne $expectedCount) { throw "Expected $expectedCount PG18 rows; got $($rows.Count)" }
            # Verbose must keep stdout JSON byte-for-byte stable and never raise trust.
            $log = Join-Path $env:RUNNER_TEMP 'verbose-stderr.log'
            $verboseJson = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --pg 18 --format json --verbose 2> $log | Out-String
            if ($LASTEXITCODE -ne 0) { throw 'Verbose JSON failed' }
            $verboseData = $verboseJson | ConvertFrom-Json
            $trace = Get-Content -LiteralPath $log -Raw
            if ($verboseJson.Trim() -cne $jsonText.Trim() -or
                $verboseData.trust -cne 'UNVERIFIED' -or
                $trace -notmatch 'VERBOSE COMMAND_START' -or
                $trace -notmatch 'CATALOG_LOCAL_LOADED' -or
                $trace -notmatch 'COMMAND_END') { throw 'Verbose stream isolation failed' }
            $duplicate = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --verbose --verbose 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $duplicate -notmatch 'DENY: Duplicate --verbose') { throw 'Duplicate verbose accepted' }
            $unsupported = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --debug 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $unsupported -notmatch 'DENY:') { throw 'Unknown flag accepted' }
            $downloadVerbose = & $exe download-all --pg 33 --verbose 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $downloadVerbose -notmatch 'DENY:') { throw 'Verbose bypassed PG validation' }
            $exactBulk = & $exe download-all --pg 15 --version 1.4.4 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $exactBulk -notmatch 'DENY: --version requires download ITEM --source pgextwin') {
              throw 'Internal bulk accepted an exact version'
            }
            if ($json.schemaVersion -ne 'pgextwin-cli-local-catalog/v1' -or
                $json.source -ne 'LOCAL_UNAUTHENTICATED' -or $json.catalogAuthenticated -ne $false -or
                $json.publicationAuthorized -ne $false -or $json.distributionAuthorized -ne $false) { throw 'JSON trust envelope mismatch' }
            if (@($json.records | Where-Object { $_.pgMajor -ne '18' -or $_.trust -ne 'UNVERIFIED' }).Count -ne 0) { throw 'JSON row trust/major mismatch' }
            $missing = Join-Path $env:RUNNER_TEMP 'pgextwin-no-catalog-here'
            $denial = & $exe list --catalog-dir $missing --pg 18 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $denial -notmatch 'DENY:') { throw 'Malformed Catalog was not fail-closed' }
            $downloadDenial = & $exe download pg_cron --pg 18 --catalog-dir $env:GITHUB_WORKSPACE 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $downloadDenial -notmatch 'DENY:') { throw 'Download accepted a local Catalog directory' }
            $invalidFormat = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --format yaml 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $invalidFormat -notmatch 'DENY:') { throw 'Unknown output format was accepted' }
            $downloadJson = & $exe download pg_cron --source pgextwin --pg 18 --format json 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $downloadJson -notmatch 'DENY:') { throw 'JSON output incorrectly allowed on download' }
            $reportDenial = & $exe verify-report pg_cron --pg 18 --catalog-dir $env:GITHUB_WORKSPACE 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $reportDenial -notmatch 'DENY:') { throw 'Unauthenticated report was not rejected' }
            # Positive Windows self-contained EXE E2E for local external ZIP batch verification.
            $bulkRoot = Join-Path $env:RUNNER_TEMP 'pgextwin-external-verify-synthetic'
            $bulkFolder = Join-Path $bulkRoot 'originals/pg18/oracle_fdw'
            New-Item -ItemType Directory -Force -Path $bulkFolder | Out-Null
            $bulkZip = Join-Path $bulkFolder 'oracle_fdw-2.9.0-pg18-win64.zip'
            Add-Type -AssemblyName System.IO.Compression
            $archive = [System.IO.Compression.ZipFile]::Open($bulkZip, [System.IO.Compression.ZipArchiveMode]::Create)
            try {
              $entry = $archive.CreateEntry('README.txt')
              $writer = [System.IO.StreamWriter]::new($entry.Open())
              try { $writer.Write('synthetic original ZIP: not for distribution') } finally { $writer.Dispose() }
            } finally { $archive.Dispose() }
            $digest = (Get-FileHash -LiteralPath $bulkZip -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item -LiteralPath $bulkZip).Length
            $ledgerFile = Join-Path $bulkRoot 'review.json'
            $ledgerDoc = @{
              schemaVersion = 'pgextwin-external-original-link-review/v1'
              scope = 'REFERENCE_TO_UNMODIFIED_PROVIDER_RELEASE_ASSET_ONLY'
              rightsReview = 'SOURCE_AND_NOTICE_REFERENCES_REVIEWED_NOT_DISTRIBUTION_APPROVAL'
              publicationAuthorized = $false; downloadAuthorized = $false
              mirrorAuthorized = $false; redistributionAuthorized = $false; signedExternalCatalogPin = $false
              records = @(@{
                extension = 'oracle_fdw'; pgMajor = '18'; sourceRepo = 'laurenz/oracle_fdw'
                repositoryId = 14332609; releaseId = 335861225; assetId = 442625860
                releaseTag = 'ORACLE_FDW_2_9_0'; assetName = 'oracle_fdw-2.9.0-pg18-win64.zip'
                originalProviderUrl = 'https://github.com/laurenz/oracle_fdw/releases/download/ORACLE_FDW_2_9_0/oracle_fdw-2.9.0-pg18-win64.zip'
                originalBytes = $size; originalSha256 = $digest
                referenceLinkReviewed = $true; downloadAuthorized = $false; mirrorAuthorized = $false
              })
            }
            $ledgerDoc | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $ledgerFile -Encoding utf8
            $bulkResult = & $exe verify external --ledger $ledgerFile --input-dir (Join-Path $bulkRoot 'originals') --pg 18 | Out-String
            if ($LASTEXITCODE -ne 0 -or $bulkResult -notmatch 'ZIP_COUNT=1' -or $bulkResult -notmatch 'DOWNLOAD_AUTHORIZED=FALSE PUBLISH=DENY') { throw 'External local batch verification EXE smoke failed' }
            $bulkDenied = & $exe verify-external-all --ledger $ledgerFile --input-dir (Join-Path $bulkRoot 'originals') --pg 17 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or $bulkDenied -notmatch 'DENY:') { throw 'Unreviewed external PG major was not denied' }
            Write-Output 'EXTERNAL_LOCAL_BULK_WIN_X64_EXE_E2E=PASS NETWORK_GET=0 PUBLISH=DENY'
            Write-Output 'CLI_R2A_NO_TRUST_ELEVATION_NEGATIVE_SMOKE=PASS'
          }
          Write-Output 'CLI_R6_PRIVATE_FRESH_RUNNER_SMOKE=PASS PUBLISH=DENY'
          # Negative tests intentionally exit 2; clear the native process code only after all assertions pass.
          $global:LASTEXITCODE = 0

  attest-provenance:
    # Signed provenance only for protected main, never an untrusted PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [candidate, independent-smoke]
    name: Sign exact Windows binary build provenance (main only)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact current-run candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-r6-private-candidate
          path: ${{ runner.temp }}/cli-signed

      - name: Validate only expected original candidate byte files
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cli-signed'
          $names = @(Get-ChildItem -LiteralPath $dir -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($names -join ',') -cne 'candidate-evidence.json,pgextwin.exe') { throw 'Unexpected candidate set' }
          $receipt = Get-Content -LiteralPath (Join-Path $dir 'candidate-evidence.json') -Raw | ConvertFrom-Json
          $sha = (Get-FileHash -LiteralPath (Join-Path $dir 'pgextwin.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.sourceCommit -cne $env:GITHUB_SHA.ToLowerInvariant() -or
              $receipt.runId -cne [string]$env:GITHUB_RUN_ID -or
              $receipt.sha256 -cne $sha -or
              $receipt.signatureVerified -ne $false -or
              $receipt.provenanceVerified -ne $false -or
              $receipt.publishAuthorized -ne $false) { throw 'Receipt identity mismatch' }
          Write-Output "CLI_PROVENANCE_INPUT_VERIFIED=$sha"

      - name: Issue Sigstore SLSA v1 attestation for actual binary (not release)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/cli-signed/pgextwin.exe

  verify-provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [attest-provenance]
    name: Independently verify signed CLI provenance and source identity
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download same-run candidate to distinct clean verifier
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-r6-private-candidate
          path: ${{ runner.temp }}/cli-verified

      - name: Independently validate SLSA, signer workflow, protected ref and SHA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'cli-verified/pgextwin.exe'
          $receipt = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'cli-verified/candidate-evidence.json') -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.sha256 -cne $digest -or
              $receipt.sourceCommit -cne $env:GITHUB_SHA.ToLowerInvariant() -or
              $receipt.runId -cne [string]$env:GITHUB_RUN_ID) { throw 'Byte/checkout/run identity mismatch' }
          $result = & gh attestation verify $exe --repo pgextwin/catalog --signer-workflow pgextwin/catalog/.github/workflows/cli-candidate.yml --source-ref refs/heads/main --source-digest $env:GITHUB_SHA --format json
          if ($LASTEXITCODE -ne 0) { throw 'Genuine SLSA signature validation failed' }
          $checked = $result | ConvertFrom-Json
          if (@($checked).Count -lt 1) { throw 'No verified attestations' }
          Write-Output "CLI_R6_GENUINE_SLSA_SIGNER_MAIN_VERIFIED=PASS SHA256=$digest PUBLISH=DENY"
