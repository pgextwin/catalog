name: CLI v0.3.1 independent public EXE and 70 ZIP Windows acceptance

on:
  workflow_run:
    workflows: ["Publish one-command pgextwin CLI v0.3.1 after signed R6 approval"]
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/cli-v031-public-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cli-v031-public-smoke.yml'

permissions:
  contents: read

jobs:
  public-cli-70:
    name: Public v0.3.1 exact-byte Sigstore and anonymous latest 70 ZIP
    if: ${{ github.repository == 'pgextwin/catalog' && ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1) || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Verify original public CLI Release/tag/5-asset identity and genuine signer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='cli-v0.3.1'
          $source='a7a1d93d38d7338d80404c402eb5faaaa96b272e'
          $digest='baee38b3aafdd1bbb7f61857747358dbd40ab056d989aa0f753c93b2025a7580'
          $r=gh api "repos/pgextwin/catalog/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $r.tag_name -cne $tag -or $r.draft -ne $false -or
              $r.prerelease -ne $true -or @($r.assets).Count -ne 5) {
            throw 'Wrong public CLI Release identity or five-asset count'
          }
          $files=[string[]]@($r.assets | ForEach-Object { $_.name })
          [Array]::Sort($files, [StringComparer]::Ordinal)
          $expected=[string[]]@('pgextwin.exe','pgextwin.spdx.json','DOTNET-LICENSE.txt','DOTNET-THIRD-PARTY-NOTICES.txt','SHA256SUMS.txt')
          [Array]::Sort($expected, [StringComparer]::Ordinal)
          if (($files -join ',') -cne ($expected -join ',')) { throw 'Public CLI asset inventory changed' }
          $asset=@($r.assets | Where-Object { $_.name -ceq 'pgextwin.exe' })
          if ($asset.Count -ne 1 -or $asset[0].digest -cne ("sha256:" + $digest) -or
              $asset[0].browser_download_url -cne "https://github.com/pgextwin/catalog/releases/download/$tag/pgextwin.exe") {
            throw 'Wrong public EXE original identity'
          }
          $ref=gh api "repos/pgextwin/catalog/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $ref.object.type -cne 'commit' -or $ref.object.sha -cne $source) {
            throw 'Public release tag did not preserve R6 signed source SHA'
          }
          $dir=Join-Path $env:RUNNER_TEMP 'public-cli-v031'
          New-Item -ItemType Directory -Path $dir | Out-Null
          $exe=Join-Path $dir 'pgextwin.exe'
          Invoke-WebRequest "https://github.com/pgextwin/catalog/releases/download/$tag/pgextwin.exe" -OutFile $exe -MaximumRedirection 5
          if (!(Test-Path -LiteralPath $exe -PathType Leaf) -or
              (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) {
            throw 'Original public EXE bytes changed'
          }
          $proof=gh attestation verify $exe --repo pgextwin/catalog --signer-workflow pgextwin/catalog/.github/workflows/cli-candidate.yml --source-ref refs/heads/main --source-digest $source --format json
          if ($LASTEXITCODE -ne 0 -or @(($proof | ConvertFrom-Json)).Count -lt 1) {
            throw 'Original public EXE independent Sigstore verification failed'
          }
          $v=(& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $v -cne '0.3.1') { throw 'Wrong public Windows CLI version' }
          Write-Output "CLI_V031_PUBLIC_ORIGINAL_SHA256_SLSA=PASS EXE_SHA256=$digest"

      - name: Execute exact default one-line 70 ZIP command on real public EXE without GitHub token
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Anonymous default command requires no Github token' }
          $exe=Join-Path $env:RUNNER_TEMP 'public-cli-v031/pgextwin.exe'
          $parent=Join-Path $env:RUNNER_TEMP 'public-latest-70'
          New-Item -ItemType Directory -Path $parent | Out-Null
          Push-Location $parent
          try {
            $result = & $exe download-all --pg all 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $result -notmatch 'CATALOG_AUTH=SIGSTORE_VERIFIED_FEED' -or
                $result -notmatch 'ZIP_COUNT=70') { throw "Public v0.3.1 one-line 70 ZIP failed: $result" }
            $folder=Join-Path $parent 'pgextwin-pg14-18'
            $data=Get-Content -LiteralPath (Join-Path $folder 'DOWNLOAD-INFO.json') -Raw | ConvertFrom-Json
            if ($data.zipCount -ne 70 -or @($data.packages).Count -ne 70 -or
                $data.source -cne 'SIGSTORE_SIGNED_CATALOG_FEED_ORIGINAL_ZIPS' -or
                $data.releaseMetadataVerified -ne $false -or $data.signatureVerified -ne $false -or
                $data.provenanceVerified -ne $false -or $data.publicationAuthorized -ne $false -or
                $data.distributionAuthorized -ne $false -or $data.installAuthorized -ne $false -or
                $data.verificationLevel -cne 'INTEGRITY_ONLY') {
              throw 'Original ZIP trust was incorrectly elevated or 70 receipt incomplete'
            }
            $count=0
            foreach ($item in $data.packages) {
              if ($item.catalogCommit -notmatch '^[0-9a-f]{40}$' -or
                  $item.releaseTag -notmatch '^[A-Za-z0-9._-]+$' -or
                  $item.relativePath -notmatch '^pg1[4-8]/[A-Za-z0-9._-]+\.zip$') {
                throw 'Unpinned or unsafe output entry'
              }
              $path=Join-Path $folder $item.relativePath
              if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Missing original Release ZIP' }
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $item.sha256 -or
                  (Get-Item -LiteralPath $path).Length -ne $item.bytes) {
                throw 'Original ZIP independent rehash mismatch'
              }
              $count++
            }
            if ($count -ne 70) { throw 'Wrong original ZIP count' }
            Write-Output 'CLI_V031_PUBLIC_ANONYMOUS_DEFAULT=PASS SHA256=70/70 SIGSTORE_CATALOG=VERIFIED EXTENSION_AUTH=INTEGRITY_ONLY'
          }
          finally { Pop-Location }
