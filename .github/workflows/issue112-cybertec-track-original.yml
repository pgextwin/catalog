name: Issue112 Cybertec pg_track_settings exact-original private audit

# PR-only. No dispatch, credential issuance, artifact upload, signing, publisher or release.
on:
  pull_request:
    paths:
      - scripts/issue112_cybertec_track_original.py
      - scripts/issue112-cybertec-track-windows-runtime.ps1
      - tests/test_issue112_cybertec_track_original.py
      - docs/issue-112-cybertec-track-original.md
      - .github/workflows/issue112-cybertec-track-original.yml

permissions:
  contents: read

jobs:
  private-original-pg14-18:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18']
    env:
      PG_MAJOR: ${{ matrix.pg }}
    steps:
      - name: Checkout candidate with no retained write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read fixed upstream 2.1.2 source tree, not provider source claim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rjuju/pg_track_settings
          ref: 36a23f3c6d684c40140da1a24b1c3ee0e707b77a
          path: pinned-upstream
          persist-credentials: false
      - name: Hostile offline verifier tests
        run: python3 -m unittest discover -s tests -p 'test_issue112_cybertec_track_original.py' -v
      - name: Read only one exact Cybertec original ZIP, rehash and compare SQL
        run: python3 scripts/issue112_cybertec_track_original.py --pg "$PG_MAJOR" --source pinned-upstream
      - name: Preserve denial of public use and redistribution
        if: always()
        run: echo 'CANDIDATE_ONLY=YES ORIGINAL_ZIP_UPLOAD=NONE WINDOWS_RUNTIME=UNVERIFIED PROVIDER_ORIGIN_ATTESTATION=UNVERIFIED PUBLIC_GET=DENY MIRROR=DENY RELEASE=DENY'

  real-windows-pg14-18:
    needs: private-original-pg14-18
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: '14', edb: '14.24.0' }
          - { pg: '15', edb: '15.19.0' }
          - { pg: '16', edb: '16.15.5' }
          - { pg: '17', edb: '17.11.4' }
          - { pg: '18', edb: '18.6.5' }
    steps:
      - name: Checkout exact candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve upstream Git blob bytes on Windows (never CRLF-transform)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout fixed upstream source, read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rjuju/pg_track_settings
          ref: 36a23f3c6d684c40140da1a24b1c3ee0e707b77a
          path: pinned-upstream
          persist-credentials: false
      - name: Checkout shared pinned EDB PostgreSQL installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 07449a2384ae4e2fc01820e263ed4bc45cd73abf
          path: build-tools
          persist-credentials: false
      - name: Set up pinned Python for private original ZIP verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Run all hostile offline ZIP verifier tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_issue112_cybertec_track_original.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Offline boundary tests failed' }
      - name: Install exact disposable EDB PostgreSQL major
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
          EDB_VERSION: ${{ matrix.edb }}
        run: |
          ./build-tools/scripts/install-postgresql.ps1 -Major ([int]$env:PG_MAJOR) -ChocolateyPackage "postgresql$($env:PG_MAJOR)" -ChocolateyVersion $env:EDB_VERSION -TestPort 55449
      - name: Verify exact original bytes and SQL functional acceptance
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: ./scripts/issue112-cybertec-track-windows-runtime.ps1 -Major ([int]$env:PG_MAJOR)
      - name: Explicit candidate-only publication denial
        if: always()
        shell: pwsh
        run: Write-Host 'PRIVATE_WINDOWS_SQL_ONLY=YES ORIGINAL_UPLOAD=NONE SIGNER=NONE PUBLIC_GET=DENY MIRROR=DENY RELEASE=DENY'
