name: Issue112 pgsql-http PG14-18 original Windows SQL (nonpublishing)

on:
  pull_request:
    paths:
      - .github/workflows/issue112-http-windows-runtime.yml
      - scripts/issue112_http_windows_runtime.py
      - tests/test_issue112_http_windows_runtime.py

permissions:
  contents: read

jobs:
  http-windows-sql:
    name: PG${{ matrix.pg }} independent original and real SQL
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: '14', edb: '14.24.0' }
          - { pg: '15', edb: '15.19.0' }
          - { pg: '16', edb: '16.15.5' }
          - { pg: '17', edb: '17.11.4' }
          - { pg: '18', edb: '18.6.5' }
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline hostile staging and original-byte equality tests
        run: python -m unittest discover -s tests -p test_issue112_http_windows_runtime.py -v
      - name: Reuse shared pinned PostgreSQL installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 07449a2384ae4e2fc01820e263ed4bc45cd73abf
          path: build-tools
          persist-credentials: false
      - name: Install disposable exact PostgreSQL host
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
          EDB_VERSION: ${{ matrix.edb }}
        run: ./build-tools/scripts/install-postgresql.ps1 -Major ([int]$env:PG_MAJOR) -ChocolateyPackage "postgresql$($env:PG_MAJOR)" -ChocolateyVersion $env:EDB_VERSION -TestPort 55454
      - name: Re-GET fixed original bytes, CREATE EXTENSION, local HTTP SQL and live loaded paths
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: python scripts/issue112_http_windows_runtime.py --pg $env:PG_MAJOR
      - name: Keep public admission and redistribution closed
        if: always()
        run: Write-Output 'CANDIDATE_ONLY=YES PUBLIC_GET=DENY MIRROR=DENY RELEASE=DENY ARTIFACT_UPLOAD=NONE'
