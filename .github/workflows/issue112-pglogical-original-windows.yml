name: Issue112 pglogical 2.4.8 original Windows PG14-18 independent candidate (DENY)

# Genuine PR-only, ephemeral Windows source acceptance. Never publish,
# sign, renew GET admission, mirror, upload originals, or modify policies.
on:
  pull_request:
    paths:
      - .github/workflows/issue112-pglogical-original-windows.yml
      - scripts/issue112_pglogical_original_windows.py
      - scripts/issue112-pglogical-original-windows.ps1
      - tests/test_issue112_pglogical_original_windows.py
      - external/windows-candidates-pglogical-v1.json

permissions:
  contents: read

jobs:
  hostile-offline-zip-gates:
    if: github.event_name == 'pull_request' && github.repository == 'pgextwin/catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Fail-closed ZIP identity, path and PE fixtures
        run: python -m unittest discover -s tests -p 'test_issue112_pglogical_original_windows.py' -v

  independent-pglogical-original-windows:
    needs: hostile-offline-zip-gates
    if: github.event_name == 'pull_request' && github.repository == 'pgextwin/catalog'
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: 14, edb: '14.24.0' }
          - { pg: 15, edb: '15.19.0' }
          - { pg: 16, edb: '16.15.5' }
          - { pg: 17, edb: '17.11.4' }
          - { pg: 18, edb: '18.6.5' }
    permissions:
      contents: read
    steps:
      - name: Checkout candidate without persisted GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse immutable protected Build installer implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 06a241f49e048abe24cce01d72ca5d972050abef
          path: build-tools
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install independently pinned EDB PostgreSQL for one major
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
          EDB_VERSION: ${{ matrix.edb }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./build-tools/scripts/install-postgresql.ps1 -Major ([int]$env:PG_MAJOR) -ChocolateyPackage "postgresql$($env:PG_MAJOR)" -ChocolateyVersion $env:EDB_VERSION -TestPort 55452
      - name: Independently GET, rehash and inspect exact provider original
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PG_MAJOR: ${{ matrix.pg }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP "issue112-pglogical-pg$($env:PG_MAJOR)-stage"
          python scripts/issue112_pglogical_original_windows.py --pg $env:PG_MAJOR --stage $stage
          if ($LASTEXITCODE -ne 0) { throw 'Independent source original verification failed' }
      - name: Actual Windows native pglogical loader, extension SQL and output plugin
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: |
          ./scripts/issue112-pglogical-original-windows.ps1 -Major ([int]$env:PG_MAJOR)
      - name: Assert strict nonpublication after every outcome
        if: always()
        shell: pwsh
        run: |
          Write-Host 'PGLOGICAL=CANDIDATE_ONLY ORIGINAL_ZIP_UPLOAD=NONE ADMISSION=NONE MIRROR=DENY RELEASE=DENY PUBLISH=DENY'
