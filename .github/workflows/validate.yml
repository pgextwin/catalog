name: Validate catalog

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Verify pinned capability sources and published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_catalog.py --verify-remote
