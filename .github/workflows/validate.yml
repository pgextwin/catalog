name: Validate catalog

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for the sealed P1 2026-10-17 Catalog Git tree check:
          # a shallow checkout cannot resolve its immutable historical commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate independent Windows Extension Landscape
        run: python scripts/validate_landscape.py

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Verify pinned capability sources and published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_catalog.py --verify-remote

      - name: Set up .NET 10 for nonpublishing CLI tests
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Compile .NET CLI (no Release/Artifact)
        run: dotnet build dotnet/PgExtWin.slnx --configuration Release --nologo

      - name: Run .NET synthetic contract tests (offline)
        run: dotnet run --project dotnet/tests/PgExtWin.Contract.Tests --configuration Release --no-build

  cli-windows-package-smoke:
    # PR-only private packaging rehearsal. No uploads, Releases, or publishing credentials.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Build prospective self-contained win-x64 single-file CLI (private only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:RUNNER_TEMP 'pgextwin-cli-preview'
          dotnet publish dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:RuntimeFrameworkVersion=10.0.13 -p:PublishTrimmed=true -p:TrimMode=full -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false --output "$publishDir" --nologo
          if ($LASTEXITCODE -ne 0) { throw 'CLI publish compilation failed' }
          $exe = Join-Path $publishDir 'pgextwin.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'pgextwin.exe missing' }
          if (Get-ChildItem -LiteralPath $publishDir -File -Filter '*.dll') { throw 'Unexpected loose DLLs in single-file output' }
          $item = Get-Item -LiteralPath $exe
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "PRIVATE_CLI_WIN_X64_SHA256=$digest SIZE=$($item.Length) PUBLISH=DENY"
          if ($item.Length -le 0) { throw 'Empty CLI binary' }

      - name: Parse versioned CLI release PowerShell without executing publication
        shell: pwsh
        run: |
          $text=Get-Content .github/workflows/cli-release.yml -Raw
          $blocks=[regex]::Matches($text,'(?m)^        run: \|\r?\n(?<code>(?:^          .*\r?\n|^\r?\n)+)')
          if ($blocks.Count -eq 0) { throw 'No release PowerShell blocks found' }
          foreach ($block in $blocks) {
            $code=$block.Groups['code'].Value -replace '(?m)^          ',''
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseInput($code,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Write-Output "CLI_RELEASE_POWERSHELL_PARSE=PASS BLOCKS=$($blocks.Count) NO_EXECUTION=true"

      - name: Smoke-check packaged CLI and negative trust path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'pgextwin-cli-preview/pgextwin.exe'
          $helpText = & $exe --help 2>&1 | Out-String
          if ($helpText -notmatch 'download-all') { throw 'Bulk download command absent' }
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'pgextwin list') { throw 'Help smoke failed' }
          $version = & $exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne ([string]([xml](Get-Content dotnet/src/PgExtWin.Cli/PgExtWin.Cli.csproj -Raw)).Project.PropertyGroup.Version)) { throw 'CLI preview version smoke failed' }
          $index = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'index.json') -Raw | ConvertFrom-Json
          $expectedCount = @($index.extensions).Count
          if ($index.schemaVersion -ne 2 -or $expectedCount -lt 14 -or $expectedCount -gt 128) { throw 'Unsupported protected Catalog fleet size' }
          $listing = @(& $exe list --catalog-dir $env:GITHUB_WORKSPACE --pg 18 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'List smoke failed' }
          if ($listing[0] -ne 'SOURCE=LOCAL_UNAUTHENTICATED TRUST=UNVERIFIED PUBLISH=DENY') { throw 'Trust banner missing' }
          $rows = @($listing | Where-Object { $_ -match '^\w+\tPG18\t' })
          if ($rows.Count -ne $expectedCount) { throw "Expected $expectedCount PG18 rows; got $($rows.Count)" }
          $jsonText = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --pg 18 --format json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'JSON list CLI failed' }
          $json = $jsonText | ConvertFrom-Json
          # Verbose must keep stdout JSON byte-for-byte stable and never raise trust.
          $log = Join-Path $env:RUNNER_TEMP 'verbose-stderr.log'
          $verboseJson = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --pg 18 --format json --verbose 2> $log | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Verbose JSON failed' }
          $verboseData = $verboseJson | ConvertFrom-Json
          $trace = Get-Content -LiteralPath $log -Raw
          if ($verboseJson.Trim() -cne $jsonText.Trim() -or
              $verboseData.trust -cne 'UNVERIFIED' -or
              $trace -notmatch 'VERBOSE COMMAND_START' -or
              $trace -notmatch 'CATALOG_LOCAL_LOADED' -or
              $trace -notmatch 'COMMAND_END') { throw 'Verbose stream isolation failed' }
          $duplicate = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --verbose --verbose 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $duplicate -notmatch 'DENY: Duplicate --verbose') { throw 'Duplicate verbose accepted' }
          $unsupported = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --debug 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $unsupported -notmatch 'DENY:') { throw 'Unknown flag accepted' }
          $downloadVerbose = & $exe download-all --pg 19 --verbose 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $downloadVerbose -notmatch 'DENY:') { throw 'Verbose bypassed PG validation' }
          $global:LASTEXITCODE = 0
          if ($json.schemaVersion -ne 'pgextwin-cli-local-catalog/v1' -or
              $json.source -ne 'LOCAL_UNAUTHENTICATED' -or $json.trust -ne 'UNVERIFIED' -or
              $json.catalogAuthenticated -ne $false -or $json.signatureVerified -ne $false -or
              $json.publicationAuthorized -ne $false -or $json.distributionAuthorized -ne $false -or
              $json.count -ne $expectedCount -or @($json.records).Count -ne $expectedCount) { throw 'JSON trust envelope or coverage mismatch' }
          if (@($json.records | Where-Object { $_.pgMajor -ne '18' -or $_.trust -ne 'UNVERIFIED' }).Count -ne 0) { throw 'JSON row trust/major mismatch' }
          $found = @(& $exe search cron --catalog-dir $env:GITHUB_WORKSPACE --pg 18 2>&1)
          if ($LASTEXITCODE -ne 0 -or (($found | Out-String) -notmatch 'pg_cron')) { throw 'Search smoke failed' }
          $missing = Join-Path $env:RUNNER_TEMP 'pgextwin-no-catalog-here'
          $denial = & $exe list --catalog-dir $missing --pg 18 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $denial -notmatch 'DENY:') { throw 'Malformed Catalog was not fail-closed' }
          $downloadDenial = & $exe download pg_cron --pg 18 --catalog-dir $env:GITHUB_WORKSPACE 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $downloadDenial -notmatch 'DENY:') { throw 'Download missing independent policy did not fail closed' }
          $invalidFormat = & $exe list --catalog-dir $env:GITHUB_WORKSPACE --format yaml 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $invalidFormat -notmatch 'DENY:') { throw 'Unknown output format was accepted' }
          $downloadJson = & $exe download pg_cron --pg 18 --catalog-dir $env:GITHUB_WORKSPACE --format json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $downloadJson -notmatch 'DENY:') { throw 'JSON output incorrectly allowed on download' }
          $reportDenial = & $exe verify-report pg_cron --pg 18 --catalog-dir $env:GITHUB_WORKSPACE 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $reportDenial -notmatch 'DENY:') { throw 'Unauthenticated report was not rejected' }
          $unsupportedVerify = & $exe verify pg_cron --pg 18 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $unsupportedVerify -notmatch 'DENY:') { throw 'Unsupported Sigstore verify was accepted' }
          Write-Output 'CLI_R2A_NO_TRUST_ELEVATION_NEGATIVE_SMOKE=PASS'
          Write-Output 'CLI_WIN_X64_PRIVATE_SMOKE=PASS VERSION_JSON_LIST_$expectedCount_SEARCH_DENY_UNTRUSTED_NO_RELEASE'
          # Negative tests intentionally exit 2; clear the native process code only after all assertions pass.
          $global:LASTEXITCODE = 0
