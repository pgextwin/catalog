name: Validate catalog

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"

      - name: Validate catalog
        run: python scripts/validate_catalog.py
