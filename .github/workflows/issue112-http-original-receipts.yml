name: Issue112 pgsql-http original ZIP byte observations (nonpublishing)
on:
  pull_request:
    paths:
      - .github/workflows/issue112-http-original-receipts.yml
      - scripts/issue112_http_original_receipts.py
      - tests/test_issue112_http_original_receipts.py
      - docs/issue-112-http-windows-source-intake.md

permissions:
  contents: read

jobs:
  http-original-observation:
    name: PG${{ matrix.pg }} exact-provider original observations (GET_DENY)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17", "18"]
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline hostile ZIP and response-stream tests
        run: python3 -m unittest discover -s tests -p test_issue112_http_original_receipts.py -v
      - name: Independently stream exact original HTTPS ZIP (research only)
        run: python3 scripts/issue112_http_original_receipts.py --pg ${{ matrix.pg }}
      - name: Never authorize signed GET, mirror, or Publisher
        if: always()
        run: echo 'ORIGINAL_OBSERVATION_ONLY=YES RIGHTS=UNVERIFIED PROVENANCE=UNVERIFIED PUBLIC_GET=DENY MIRROR=DENY RELEASE=DENY'
