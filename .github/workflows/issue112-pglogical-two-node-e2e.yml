name: Issue112 pglogical 2.4.8 original two-node replication E2E (DENY)

# New, separate PR-only test. The previously successful single-node Windows
# Run is evidence only and is not re-run. No write token or release action.
on:
  pull_request:
    paths:
      - .github/workflows/issue112-pglogical-two-node-e2e.yml
      - scripts/issue112-pglogical-two-node-e2e.ps1
      - scripts/issue112_pglogical_vendor_sigstore.py

permissions:
  contents: read

jobs:
  independent-provider-sigstore:
    if: github.event_name == 'pull_request' && github.repository == 'pgextwin/catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    steps:
      - name: Checkout PR without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Independently bind original ZIP to exact Sigstore signer, commit and run
        env:
          GH_TOKEN: ${{ github.token }}
          PG_MAJOR: ${{ matrix.pg }}
        run: python scripts/issue112_pglogical_vendor_sigstore.py --pg "$PG_MAJOR"

  two-node-replication:
    if: github.event_name == 'pull_request' && github.repository == 'pgextwin/catalog'
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: 14, edb: '14.24.0' }
          - { pg: 15, edb: '15.19.0' }
          - { pg: 16, edb: '16.15.5' }
          - { pg: 17, edb: '17.11.4' }
          - { pg: 18, edb: '18.6.5' }
    steps:
      - name: Checkout PR without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse proven immutable EDB installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 06a241f49e048abe24cce01d72ca5d972050abef
          path: build-tools
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned EDB PostgreSQL on ephemeral Windows
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
          EDB_VERSION: ${{ matrix.edb }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./build-tools/scripts/install-postgresql.ps1 -Major ([int]$env:PG_MAJOR) -ChocolateyPackage "postgresql$($env:PG_MAJOR)" -ChocolateyVersion $env:EDB_VERSION -TestPort 55452
      - name: Independently rehash original provider ZIP for this separate two-node test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PG_MAJOR: ${{ matrix.pg }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP "issue112-pglogical-pg$($env:PG_MAJOR)-stage"
          python scripts/issue112_pglogical_original_windows.py --pg $env:PG_MAJOR --stage $stage
          if ($LASTEXITCODE -ne 0) { throw 'Exact private original ZIP qualification failed' }
      - name: Exercise actual pglogical provider and subscriber (initial sync and UPDATE)
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: |
          ./scripts/issue112-pglogical-two-node-e2e.ps1 -Major ([int]$env:PG_MAJOR)
      - name: Preserve strict denial on all outcomes
        if: always()
        shell: pwsh
        run: |
          Write-Host 'PUBLISH=DENY PUBLIC_GET=DENY MIRROR=DENY REDISTRIBUTION=DENY SIGNED_ADMISSION=NONE'
