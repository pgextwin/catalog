name: Verify public Website immediately after Catalog main merge

on:
  push:
    branches: [main]

# Invoke Website's audited reusable workflow directly; no PAT, private key,
# additional GitHub App or admin setting is needed for public repositories.
permissions:
  contents: read

jobs:
  live_pages_audit:
    name: Cross-repository public Catalog, Release and Pages acceptance
    permissions:
      contents: read
    uses: pgextwin/website/.github/workflows/pages-smoke.yml@ca59d629396eefb6dded4a0449fb11b206891956
