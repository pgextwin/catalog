name: Issue112 OSGeo exact original .NET live integrity (nonpublishing)

on:
  pull_request:
    paths:
      - dotnet/tests/PgExtWin.Contract.Tests/OsgeoOriginalCandidateTransportTests.cs
      - dotnet/tests/PgExtWin.Contract.Tests/Program.cs
      - docs/issue-112-osgeo-https-candidate-adapter.md
      - .github/workflows/issue112-osgeo-dotnet-live-original.yml

permissions:
  contents: read

jobs:
  real-dotnet-original-nonpublishing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # existing contract tests inspect immutable historical Git blobs
      - name: Set up pinned .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402'
      - name: Build internal read-only candidate tests
        run: dotnet build dotnet/PgExtWin.slnx --configuration Release --nologo
      - name: Download and inspect exact OSGeo HTTPS bytes with .NET (no public CLI)
        env:
          PGEXTWIN_OSGEO_LIVE_ORIGINAL: '1'
        run: dotnet run --project dotnet/tests/PgExtWin.Contract.Tests --configuration Release --no-build
      - name: Deny licensing, provenance, signing, mirror and publication claims
        if: always()
        run: echo 'OSGEO_DOTNET_LIVE=INTEGRITY_ONLY LICENSE=UNVERIFIED NOTICE=UNVERIFIED PRODUCER_PROVENANCE=UNVERIFIED SIGNATURE=NO PUBLIC_GET=DENY MIRROR=DENY RELEASE=DENY'
