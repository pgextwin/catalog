name: Archive pin audit

# Periodic full online re-verification of every signed GET-only pin
# archive, including expired history. Per-PR validation
# (scripts/validate_public_get_pin.py without --all-online) authenticates
# only the current latest-referenced pin and still-valid admissions
# online; expired archives confer no authorization and are re-verified
# here instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-pin-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Fully re-verify every signed pin archive online
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/validate_public_get_pin.py --catalog . --all-online
