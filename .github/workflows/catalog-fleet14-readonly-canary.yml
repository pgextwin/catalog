name: Catalog 14-extension read-only canary (Issue 75)

# ONE-SHOT protected-main push/path-only acceptance. The existing separate
# wal2json daily 09:30 JST schedule remains intact; no fleet schedule.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/catalog-fleet14-readonly-canary.yml

permissions:
  contents: read

concurrency:
  group: issue75-catalog-fleet14-canary-main
  cancel-in-progress: false

jobs:
  fleet14-readonly:
    name: Catalog 14-extension public metadata canary (inert)
    if: ${{ github.event_name == 'push' && github.repository == 'pgextwin/catalog' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out protected main at exact triggering SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Validate unchanged wal2json and fleet14 fail-closed tests offline
        run: |
          python -m unittest discover -s tests -p 'test_catalog_scheduled_readonly.py' -v
          python -m unittest discover -s tests -p 'test_catalog_fleet14_readonly.py' -v

      - name: Read-only authenticated fleet metadata double-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/catalog_fleet14_readonly.py

      - name: Never publish or propose on canary success
        if: ${{ success() }}
        run: echo 'DRY_RUN_FLEET14_METADATA_ONLY; no PR, Release, tag, Dispatch or signed-asset authorization'
