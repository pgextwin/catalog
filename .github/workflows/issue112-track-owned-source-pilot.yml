name: Issue112 pg_track_settings owned-source PRIVATE pilot
on:
  pull_request:
    paths:
      - scripts/issue112_track_owned_source_pilot.py
      - scripts/issue112-track-owned-source-windows.ps1
      - tests/test_issue112_track_owned_source_pilot.py
      - docs/issue-112-track-owned-source-pilot.md
      - .github/workflows/issue112-track-owned-source-pilot.yml
permissions:
  contents: read
jobs:
  immutable-source-license-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rjuju/pg_track_settings
          ref: 36a23f3c6d684c40140da1a24b1c3ee0e707b77a
          path: pinned-upstream
          persist-credentials: false
      - name: Run hostile offline tests
        run: python3 -m unittest discover -s tests -p 'test_issue112_track_owned_source_pilot.py' -v
      - name: Build five local ephemeral ZIPs from pinned licensed upstream source
        shell: bash
        run: |
          set -euo pipefail
          for pg in 14 15 16 17 18; do
            python3 scripts/issue112_track_owned_source_pilot.py --source pinned-upstream --pg "$pg" --output "$RUNNER_TEMP/track-owned-pg${pg}.zip"
          done
          echo 'SOURCE_PIN=PASS LICENSE=EMBEDDED ZIP_UPLOAD=NONE PUBLIC_GET=DENY RELEASE=DENY'
  owned-source-real-windows:
    needs: immutable-source-license-offline
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: 14, edb: '14.24.0' }
          - { pg: 15, edb: '15.19.0' }
          - { pg: 16, edb: '16.15.5' }
          - { pg: 17, edb: '17.11.4' }
          - { pg: 18, edb: '18.6.5' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve upstream bytes (disable CRLF transformation)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rjuju/pg_track_settings
          ref: 36a23f3c6d684c40140da1a24b1c3ee0e707b77a
          path: pinned-upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 07449a2384ae4e2fc01820e263ed4bc45cd73abf
          path: build-tools
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install disposable EDB PostgreSQL
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
          EDB_VERSION: ${{ matrix.edb }}
        run: |
          ./build-tools/scripts/install-postgresql.ps1 -Major ([int]$env:PG_MAJOR) -ChocolateyPackage "postgresql$($env:PG_MAJOR)" -ChocolateyVersion $env:EDB_VERSION -TestPort 55459
      - name: Independently rehash source-owned ZIP and exercise real Windows SQL
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: ./scripts/issue112-track-owned-source-windows.ps1 -Major ([int]$env:PG_MAJOR)
      - name: Explicit nonpublishing boundary
        if: always()
        shell: pwsh
        run: Write-Host 'CANDIDATE_ONLY=YES ORIGINAL_CYBERTEC_GET=NONE ZIP_UPLOAD=NONE SIGNER=NONE PUBLISHER=NONE PUBLIC_GET=DENY RELEASE=DENY'
