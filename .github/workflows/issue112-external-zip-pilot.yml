name: Issue112 external ZIP original-byte read-only pilot

on:
  pull_request:
    paths:
      - scripts/issue112-external-zip-pilot.py
      - .github/workflows/issue112-external-zip-pilot.yml

permissions:
  contents: read

jobs:
  original-zip-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Independently hash official and community original ZIP bytes (nonpublishing)
        run: python3 scripts/issue112-external-zip-pilot.py
